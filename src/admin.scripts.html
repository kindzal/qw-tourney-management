<script>
  let currentSheet = null;

  function hideAllSections() {
    document.querySelectorAll('.section')
      .forEach(sec => sec.style.display = 'none');
  }

  function showSection(sheetName) {
    hideAllSections();

    document.getElementById("currentTab").innerText = sheetName;

    const section = document.getElementById(sheetName);

    if (section) {
      if (sheetName === 'FIX-ME') {
        refreshFixMeStatus();
        startFixMeMonitoring();
      } else if (sheetName === 'Schedule') {
        togglePlayoffsSection();
      } else if (sheetName === 'Configuration') {
        initConfigurationSection();
      }
      section.style.display = "block";
    } else {
      document.getElementById("DefaultTitle").innerText = sheetName;
      document.getElementById("Default").style.display = "block";
    }
  }

  async function copyToClipboard(elementId, btn) {
    const element = document.getElementById(elementId);
    
    if (!element) {
      console.error('Element not found');
      return;
    }

    // Use .value for inputs/textareas, .innerText for divs/spans
    const text = element.tagName === 'INPUT' || element.tagName === 'TEXTAREA' ? element.value : element.innerText;

    try {
      await navigator.clipboard.writeText(text);
      
      // Save original state
      const originalContent = btn.innerHTML;
      
      // Change to "Copied ✔"
      btn.innerHTML = 'Copied &#10004;'; // Unicode for tick sign
      btn.style.pointerEvents = 'none'; // Prevent double-clicks during delay

      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.style.pointerEvents = 'auto';
      }, 2000);

    } catch (err) {
      console.error('Failed to copy: ', err);
    }
  }

  function runTask(functionName, parameter = null) {
    const loader = document.getElementById('loader-overlay');
    
    // 1. Show the spinner
    loader.style.display = 'flex';
    
    // 2. Build the runner
    const runner = google.script.run
      .withSuccessHandler(() => {
        loader.style.display = 'none';
      })
      .withFailureHandler((msg) => {
        loader.style.display = 'none';
        alert('Error: ' + msg);
      });

    // 3. Call the function with or without the parameter
    if (parameter !== null) {
      runner[functionName](parameter);
    } else {
      runner[functionName]();
    }
  }
  
  function checkActiveSheet() {
    google.script.run
      .withSuccessHandler(function(sheetName) {
        if (sheetName !== currentSheet) {
          currentSheet = sheetName;
          showSection(sheetName);
        }
      })
      .getActiveSheetName();
  }

  function refreshFixMeStatus() {
    google.script.run
      .withSuccessHandler(function(hasIssues) {
        document.getElementById('fixme-issues').style.display = hasIssues ? 'block' : 'none';
        document.getElementById('fixme-no-issues').style.display = hasIssues ? 'none' : 'block';
      })
      .checkForIssues();
  }

  function togglePlayoffsSection() {
    const required = document.getElementById('playoffsRequired').value;
    const section = document.getElementById('playoffsSection');
    section.style.display = required === 'Yes' ? 'block' : 'none';
  }

  function submitScheduleForm() {

    const data = {
      groupStage: document.getElementById('groupStage').value,
      groupStageMode: document.getElementById('groupStageMode').value,
      playoffsRequired: document.getElementById('playoffsRequired').value,
      playoffsType: document.getElementById('playoffsType').value,
      playoffsMode: document.getElementById('playoffsMode').value
    };

    const btn = document.getElementById('generateScheduleBtn');
    const messageBox = document.getElementById('scheduleMessage');
    const loader = document.getElementById('loader-overlay');

    messageBox.innerText = '';
    messageBox.className = 'form-message';

    btn.disabled = true;
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(confirmed) {
        if (!confirmed) {
          loader.style.display = 'none';
          btn.disabled = false;
          return;
        }

        google.script.run
          .withSuccessHandler(function(response) {
            loader.style.display = 'none';
            btn.disabled = false;
            messageBox.innerText = response;
            messageBox.classList.add('success');
          })
          .withFailureHandler(function(error) {
            loader.style.display = 'none';
            btn.disabled = false;
            messageBox.innerText = 'Error: ' + error.message;
            messageBox.classList.add('error');
          })
          .generateSchedule(data);
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })
      .confirmScheduleOverwrite();
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // Configuration Section - Trigger Installation
  // ═══════════════════════════════════════════════════════════════════════════

  function initConfigurationSection() {
    google.script.run
      .withSuccessHandler(function(status) {
        // Trigger 1: Automation - hide entire section if installed (critical)
        document.getElementById('trigger-automation').style.display = 
          status.needsAutomation ? 'block' : 'none';

        // Trigger 2: Reminders - show section, toggle button and status
        const remindersSection = document.getElementById('trigger-reminders');
        remindersSection.style.display = 'block';
        document.getElementById('install-reminders-btn').style.display = 
          status.needsReminders ? 'inline-block' : 'none';
        document.getElementById('disable-reminders-btn').style.display = 
          status.hasReminders ? 'inline-block' : 'none';
        document.getElementById('reminders-status-disabled').style.display = 
          status.needsReminders ? 'block' : 'none';
        document.getElementById('reminders-status-enabled').style.display = 
          status.hasReminders ? 'block' : 'none';
        document.getElementById('reminders-warning').style.display = 
          status.missingRoleIds ? 'block' : 'none';

        // Trigger 3: Auto Import - show section, toggle button and status
        const autoImportSection = document.getElementById('trigger-autoimport');
        autoImportSection.style.display = 'block';
        document.getElementById('install-autoimport-btn').style.display = 
          status.needsAutoImport ? 'inline-block' : 'none';
        document.getElementById('disable-autoimport-btn').style.display = 
          status.hasAutoImport ? 'inline-block' : 'none';
        document.getElementById('autoimport-status-disabled').style.display = 
          status.needsAutoImport ? 'block' : 'none';
        document.getElementById('autoimport-status-enabled').style.display = 
          status.hasAutoImport ? 'block' : 'none';

        // Trigger 4: Fix-Me - show section, toggle button and status
        const fixMeSection = document.getElementById('trigger-fixme');
        fixMeSection.style.display = 'block';
        document.getElementById('install-fixme-btn').style.display = 
          status.needsFixMe ? 'inline-block' : 'none';
        document.getElementById('disable-fixme-btn').style.display = 
          status.hasFixMe ? 'inline-block' : 'none';
        document.getElementById('fixme-status-disabled').style.display = 
          status.needsFixMe ? 'block' : 'none';
        document.getElementById('fixme-status-enabled').style.display = 
          status.hasFixMe ? 'block' : 'none';
        document.getElementById('fixme-warning').style.display = 
          status.missingAdminWebhook ? 'block' : 'none';

        // Show "all installed" message only if everything is installed
        const allInstalled = status.hasAutomation && status.hasReminders && 
                            status.hasAutoImport && status.hasFixMe;
        document.getElementById('all-triggers-installed').style.display = 
          allInstalled ? 'block' : 'none';
      })
      .withFailureHandler(function(error) {
        console.error('Failed to check trigger status:', error);
      })
      .checkTriggerStatus();
  }

  function installAutomationTrigger() {
    const btn = event.target;
    const messageBox = document.getElementById('automation-message');
    const loader = document.getElementById('loader-overlay');

    btn.disabled = true;
    messageBox.innerText = '';
    messageBox.className = 'form-message';
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(response) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = response;
        messageBox.classList.add('success');
        setTimeout(() => initConfigurationSection(), 2000);
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })

  // ═══════════════════════════════════════════════════════════════════════════
  // FIX-ME Section - Interactive Issue Fixing
  // ═══════════════════════════════════════════════════════════════════════════

  let fixMeMonitoringInterval = null;
  let currentIssueData = null;

  function startFixMeMonitoring() {
    // Clear any existing interval
    if (fixMeMonitoringInterval) {
      clearInterval(fixMeMonitoringInterval);
    }

    // Check selection every 500ms
    fixMeMonitoringInterval = setInterval(checkFixMeSelection, 500);
    
    // Initial check
    checkFixMeSelection();
  }

  function checkFixMeSelection() {
    google.script.run
      .withSuccessHandler(function(result) {
        const button = document.getElementById('fix-selected-btn');
        const status = document.getElementById('fix-button-status');
        const dropdownContainer = document.getElementById('fix-dropdown-container');
        const dropdownLabel = document.getElementById('fix-dropdown-label');
        const dropdown = document.getElementById('fix-target-select');
        
        if (result && result.canFix) {
          // Check if the issue data has actually changed
          const dataChanged = !currentIssueData || 
                              currentIssueData.issueType !== result.issueType ||
                              currentIssueData.value !== result.value ||
                              JSON.stringify(currentIssueData.targets) !== JSON.stringify(result.targets);
          
          // Store current issue data
          currentIssueData = result;
          
          // Update status
          status.style.color = '#2d8f2d';
          status.innerHTML = `<strong>Selected:</strong> ${result.issueType} - "${result.value}"`;
          
          // Show and populate dropdown
          dropdownContainer.style.display = 'block';
          
          // Update label based on issue type
          if (result.issueType === 'Unmatched Player') {
            dropdownLabel.textContent = 'Select Player to add this Game Nick to:';
          } else {
            dropdownLabel.textContent = 'Select Team to add this Team Tag to:';
          }
          
          // Only repopulate dropdown if data has changed
          if (dataChanged) {
            // Save current selection
            const currentSelection = dropdown.value;
            
            // Populate dropdown with options
            dropdown.innerHTML = '<option value="">-- Select --</option>';
            result.targets.forEach(function(target) {
              const option = document.createElement('option');
              option.value = target.row;
              option.textContent = target.name;
              dropdown.appendChild(option);
            });
            
            // Restore selection if it still exists in the new options
            if (currentSelection) {
              const optionExists = Array.from(dropdown.options).some(opt => opt.value === currentSelection);
              if (optionExists) {
                dropdown.value = currentSelection;
              }
            }
          }
          
          // Set up onchange handler (only if not already set)
          if (!dropdown.onchange) {
            dropdown.onchange = function() {
              if (dropdown.value) {
                button.disabled = false;
                button.style.opacity = '1';
                button.style.cursor = 'pointer';
              } else {
                button.disabled = true;
                button.style.opacity = '0.5';
                button.style.cursor = 'not-allowed';
              }
            };
          }
          
          // Update button state based on current dropdown value
          if (dropdown.value) {
            button.disabled = false;
            button.style.opacity = '1';
            button.style.cursor = 'pointer';
          } else {
            button.disabled = true;
            button.style.opacity = '0.5';
            button.style.cursor = 'not-allowed';
          }
          
        } else {
          // Hide dropdown and disable button
          currentIssueData = null;
          dropdownContainer.style.display = 'none';
          button.disabled = true;
          button.style.opacity = '0.5';
          button.style.cursor = 'not-allowed';
          
          // Update status
          status.style.color = '#666';
          status.textContent = result ? result.message : 'No row selected';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to check selection:', error);
      })
      .getSelectedFixMeIssue();
  }

  function fixSelectedIssue() {
    if (!currentIssueData) {
      return;
    }
    
    const dropdown = document.getElementById('fix-target-select');
    const targetRow = parseInt(dropdown.value);
    
    if (!targetRow) {
      alert('Please select a Player or Team from the dropdown');
      return;
    }
    
    const button = document.getElementById('fix-selected-btn');
    const messageBox = document.getElementById('fix-message');
    const loader = document.getElementById('loader-overlay');

    button.disabled = true;
    button.style.opacity = '0.5';
    messageBox.innerText = '';
    messageBox.className = 'form-message';
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(response) {
        loader.style.display = 'none';
        messageBox.innerText = response;
        messageBox.classList.add('success');
        
        // Refresh the FIX-ME status after 2 seconds
        setTimeout(() => {
          messageBox.innerText = '';
          messageBox.className = 'form-message';
          refreshFixMeStatus();
          checkFixMeSelection();
        }, 2000);
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        button.disabled = false;
        button.style.opacity = '1';
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })
      .fixSelectedFixMeIssue(targetRow);
  }
