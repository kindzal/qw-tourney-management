<script>
  let currentSheet = null;

  function hideAllSections() {
    document.querySelectorAll('.section')
      .forEach(sec => sec.style.display = 'none');
  }

  function showSection(sheetName) {
    hideAllSections();

    document.getElementById("currentTab").innerHTML = `<span class="qwadmin-brand">🏆 QWadmin</span> ➡ ${sheetName}`;

    const section = document.getElementById(sheetName);

    if (section) {
      if (sheetName === 'FIX-ME') {
        refreshFixMeStatus();
        startFixMeMonitoring();
      } else if (sheetName === 'Schedule') {
        togglePlayoffsSection();
        checkPlayoffsStatus();
      } else if (sheetName === 'Configuration') {
        initConfigurationSection();
      } else if (sheetName === 'Discord') {
        initDiscordSection();
      }
      section.style.display = "block";
    } else {
      document.getElementById("DefaultTitle").innerText = sheetName;
      document.getElementById("Default").style.display = "block";
    }
  }

  async function copyToClipboard(elementId, btn) {
    const element = document.getElementById(elementId);
    
    if (!element) {
      console.error('Element not found');
      return;
    }

    // Use .value for inputs/textareas, .innerText for divs/spans
    const text = element.tagName === 'INPUT' || element.tagName === 'TEXTAREA' ? element.value : element.innerText;

    try {
      await navigator.clipboard.writeText(text);
      
      // Save original state
      const originalContent = btn.innerHTML;
      
      // Change to "Copied ✔"
      btn.innerHTML = 'Copied &#10004;'; // Unicode for tick sign
      btn.style.pointerEvents = 'none'; // Prevent double-clicks during delay

      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.style.pointerEvents = 'auto';
      }, 2000);

    } catch (err) {
      console.error('Failed to copy: ', err);
    }
  }

  function runTask(functionName, parameter = null) {
    const loader = document.getElementById('loader-overlay');
    
    // 1. Show the spinner
    loader.style.display = 'flex';
    
    // 2. Build the runner
    const runner = google.script.run
      .withSuccessHandler(() => {
        loader.style.display = 'none';
      })
      .withFailureHandler((msg) => {
        loader.style.display = 'none';
        alert('Error: ' + msg);
      });

    // 3. Call the function with or without the parameter
    if (parameter !== null) {
      runner[functionName](parameter);
    } else {
      runner[functionName]();
    }
  }
  
  function checkActiveSheet() {
    google.script.run
      .withSuccessHandler(function(sheetName) {
        if (sheetName !== currentSheet) {
          currentSheet = sheetName;
          showSection(sheetName);
        }
      })
      .getActiveSheetName();
  }

  function refreshFixMeStatus() {
    google.script.run
      .withSuccessHandler(function(hasIssues) {
        document.getElementById('fixme-issues').style.display = hasIssues ? 'block' : 'none';
        document.getElementById('fixme-no-issues').style.display = hasIssues ? 'none' : 'block';
      })
      .checkForIssues();
  }

  function togglePlayoffsSection() {
    const required = document.getElementById('playoffsRequired').value;
    const section = document.getElementById('playoffsSection');
    section.style.display = required === 'Yes' ? 'block' : 'none';
  }

  function checkPlayoffsStatus() {
    google.script.run
      .withSuccessHandler(function(status) {
        const warningBox = document.getElementById('playoffsWarning');
        const warningMsg = document.getElementById('playoffsWarningMessage');
        const generationSection = document.getElementById('scheduleGenerationSection');
        
        if (status.warning) {
          warningBox.style.display = 'block';
          warningMsg.innerText = status.warning;
        } else {
          warningBox.style.display = 'none';
        }
        
        // Hide schedule generation section if group stage is complete
        if (status.complete && generationSection) {
          generationSection.style.display = 'none';
        } else if (generationSection) {
          generationSection.style.display = 'block';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to check playoffs status:', error);
      })
      .checkGroupStageStatus();
  }

  function submitScheduleForm() {

    const data = {
      groupStage: document.getElementById('groupStage').value,
      groupStageMode: document.getElementById('groupStageMode').value,
      playoffsRequired: document.getElementById('playoffsRequired').value,
      playoffsType: document.getElementById('playoffsType').value,
      playoffsMode: document.getElementById('playoffsMode').value
    };

    const btn = document.getElementById('generateScheduleBtn');
    const messageBox = document.getElementById('scheduleMessage');
    const loader = document.getElementById('loader-overlay');

    messageBox.innerText = '';
    messageBox.className = 'form-message';

    btn.disabled = true;
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(confirmed) {
        if (!confirmed) {
          loader.style.display = 'none';
          btn.disabled = false;
          return;
        }

        google.script.run
          .withSuccessHandler(function(response) {
            loader.style.display = 'none';
            btn.disabled = false;
            messageBox.innerText = response;
            messageBox.classList.add('success');
          })
          .withFailureHandler(function(error) {
            loader.style.display = 'none';
            btn.disabled = false;
            messageBox.innerText = 'Error: ' + error.message;
            messageBox.classList.add('error');
          })
          .generateSchedule(data);
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })
      .confirmScheduleOverwrite();
  }

  function populatePlayoffs() {
    const btn = document.getElementById('populatePlayoffsBtn');
    const messageBox = document.getElementById('playoffsMessage');
    const warningBox = document.getElementById('playoffsWarning');
    const warningMsg = document.getElementById('playoffsWarningMessage');
    const loader = document.getElementById('loader-overlay');

    messageBox.innerText = '';
    messageBox.className = 'form-message';
    warningBox.style.display = 'none';

    btn.disabled = true;
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(result) {
        loader.style.display = 'none';
        btn.disabled = false;
        
        messageBox.innerText = result.message;
        messageBox.classList.add(result.success ? 'success' : 'error');
        
        // Refresh status after population
        checkPlayoffsStatus();
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })
      .populatePlayoffsMatchups();
  }

  function initConfigurationSection() {
    // Check Web App deployment status
    google.script.run
      .withSuccessHandler(function(deploymentStatus) {
        // Show input section if URL is not configured
        const needsUrl = !deploymentStatus.hasConfiguredUrl;
        document.getElementById('webapp-url-not-configured').style.display = 
          needsUrl ? 'block' : 'none';
        
        // Show entire section only if URL is not configured (not deployed warning removed since we can't detect it reliably)
        document.getElementById('webapp-deployment').style.display = 
          needsUrl ? 'block' : 'none';
      })
      .withFailureHandler(function(error) {
        console.error('Failed to check Web App deployment:', error);
      })
      .checkWebAppDeployment();

    // Check trigger status
    google.script.run
      .withSuccessHandler(function(status) {
        // Trigger 1: Automation - hide entire section if installed (critical)
        document.getElementById('trigger-automation').style.display = 
          status.needsAutomation ? 'block' : 'none';

        // Trigger 2: Reminders - show section, toggle button and status
        const remindersSection = document.getElementById('trigger-reminders');
        remindersSection.style.display = 'block';
        document.getElementById('install-reminders-btn').style.display = 
          status.needsReminders ? 'inline-block' : 'none';
        document.getElementById('disable-reminders-btn').style.display = 
          status.hasReminders ? 'inline-block' : 'none';
        document.getElementById('reminders-status-disabled').style.display = 
          status.needsReminders ? 'block' : 'none';
        document.getElementById('reminders-status-enabled').style.display = 
          status.hasReminders ? 'block' : 'none';
        document.getElementById('reminders-warning').style.display = 
          status.missingRoleIds ? 'block' : 'none';

        // Trigger 3: Auto Import - show section, toggle button and status
        const autoImportSection = document.getElementById('trigger-autoimport');
        autoImportSection.style.display = 'block';
        document.getElementById('install-autoimport-btn').style.display = 
          status.needsAutoImport ? 'inline-block' : 'none';
        document.getElementById('disable-autoimport-btn').style.display = 
          status.hasAutoImport ? 'inline-block' : 'none';
        document.getElementById('autoimport-status-disabled').style.display = 
          status.needsAutoImport ? 'block' : 'none';
        document.getElementById('autoimport-status-enabled').style.display = 
          status.hasAutoImport ? 'block' : 'none';

        // Trigger 4: Fix-Me - show section, toggle button and status
        const fixMeSection = document.getElementById('trigger-fixme');
        fixMeSection.style.display = 'block';
        document.getElementById('install-fixme-btn').style.display = 
          status.needsFixMe ? 'inline-block' : 'none';
        document.getElementById('disable-fixme-btn').style.display = 
          status.hasFixMe ? 'inline-block' : 'none';
        document.getElementById('fixme-status-disabled').style.display = 
          status.needsFixMe ? 'block' : 'none';
        document.getElementById('fixme-status-enabled').style.display = 
          status.hasFixMe ? 'block' : 'none';
        document.getElementById('fixme-warning').style.display = 
          status.missingAdminWebhook ? 'block' : 'none';

        // Trigger 5: Auto Discord - show section, toggle button and status
        const autoDiscordSection = document.getElementById('trigger-autodiscord');
        autoDiscordSection.style.display = 'block';
        document.getElementById('install-autodiscord-btn').style.display = 
          status.needsAutoDiscord ? 'inline-block' : 'none';
        document.getElementById('disable-autodiscord-btn').style.display = 
          status.hasAutoDiscord ? 'inline-block' : 'none';
        document.getElementById('autodiscord-status-disabled').style.display = 
          status.needsAutoDiscord ? 'block' : 'none';
        document.getElementById('autodiscord-status-enabled').style.display = 
          status.hasAutoDiscord ? 'block' : 'none';
        document.getElementById('autodiscord-warning').style.display = 
          status.missingScheduleWebhook ? 'block' : 'none';

        // Show "all installed" message only if everything is installed
        const allInstalled = status.hasAutomation && status.hasReminders && 
                            status.hasAutoImport && status.hasFixMe && status.hasAutoDiscord;
        document.getElementById('all-triggers-installed').style.display = 
          allInstalled ? 'block' : 'none';
      })
      .withFailureHandler(function(error) {
        console.error('Failed to check trigger status:', error);
      })
      .checkTriggerStatus();
  }

  function saveDeploymentUrlFromUI() {
    const btn = event.target;
    const input = document.getElementById('webapp-url-input');
    const messageBox = document.getElementById('webapp-message');
    const loader = document.getElementById('loader-overlay');
    const url = input.value.trim();

    if (!url) {
      messageBox.innerText = 'Please enter the deployment URL';
      messageBox.className = 'form-message error';
      return;
    }

    // Validate URL format
    if (!url.match(/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/)) {
      messageBox.innerText = 'Invalid URL format. Expected: https://script.google.com/macros/s/.../exec';
      messageBox.className = 'form-message error';
      return;
    }

    btn.disabled = true;
    messageBox.innerText = '';
    messageBox.className = 'form-message';
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(response) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = response.message;
        messageBox.classList.add(response.success ? 'success' : 'error');
        if (response.success) {
          setTimeout(() => initConfigurationSection(), 2000);
        }
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        btn.disabled = false;
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })
      .saveDeploymentUrl(url);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // FIX-ME Section - Interactive Issue Fixing
  // ═══════════════════════════════════════════════════════════════════════════

  let fixMeMonitoringInterval = null;
  let currentIssueData = null;

  function startFixMeMonitoring() {
    // Clear any existing interval
    if (fixMeMonitoringInterval) {
      clearInterval(fixMeMonitoringInterval);
    }

    // Check selection every 500ms
    fixMeMonitoringInterval = setInterval(checkFixMeSelection, 500);
    
    // Initial check
    checkFixMeSelection();
  }

  function checkFixMeSelection() {
    google.script.run
      .withSuccessHandler(function(result) {
        const button = document.getElementById('fix-selected-btn');
        const status = document.getElementById('fix-button-status');
        const dropdownContainer = document.getElementById('fix-dropdown-container');
        const dropdownLabel = document.getElementById('fix-dropdown-label');
        const dropdown = document.getElementById('fix-target-select');
        
        if (result && result.canFix) {
          // Check if the issue data has actually changed
          const dataChanged = !currentIssueData || 
                              currentIssueData.issueType !== result.issueType ||
                              currentIssueData.value !== result.value ||
                              JSON.stringify(currentIssueData.targets) !== JSON.stringify(result.targets) ||
                              JSON.stringify(currentIssueData.maps) !== JSON.stringify(result.maps);
          
          // Store current issue data
          currentIssueData = result;
          
          // Update status
          status.style.color = '#2d8f2d';
          status.innerHTML = `<strong>Selected:</strong> ${result.issueType} - "${result.value}"`;

          // Hide both containers by default
          dropdownContainer.style.display = 'none';
          const incorrectContainer = document.getElementById('incorrect-maps-container');
          incorrectContainer.style.display = 'none';

          // If it's a standard unmatched issue, show the dropdown
          if (result.issueType === 'Unmatched Player' || result.issueType === 'Unmatched Team Tag') {
            dropdownContainer.style.display = 'block';
            if (result.issueType === 'Unmatched Player') {
              dropdownLabel.textContent = 'Select Player to add this Game Nick to:';
            } else {
              dropdownLabel.textContent = 'Select Team to add this Team Tag to:';
            }
          }

          // If it's Incorrect Number of Maps, show the custom radio-list UI
          if (result.issueType === 'Incorrect Number of Maps') {
            incorrectContainer.style.display = 'block';
            // Populate heading and list
            const heading = document.getElementById('incorrect-maps-heading');
            const list = document.getElementById('incorrect-maps-list');
            heading.textContent = `Incorrect number of maps in ${String(result.stage||'').toLowerCase()} match round ${String(result.round||'').toLowerCase()} at ${result.date || ''}`;
            const matchDiv = document.getElementById('incorrect-maps-match');
            if (matchDiv) {
              if (result.match) {
                matchDiv.textContent = result.match;
                matchDiv.style.display = 'block';
              } else {
                matchDiv.textContent = '';
                matchDiv.style.display = 'none';
              }
            }
            // Only repopulate if data changed
            if (dataChanged) {
              list.innerHTML = '';
              (result.maps || []).forEach(function(m, idx) {
                const id = 'incmap_' + idx;
                const wrapper = document.createElement('div');
                wrapper.style.marginBottom = '6px';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'incmap';
                radio.value = m.gameUrl || m.mapUrl || '';
                radio.id = id;

                const label = document.createElement('label');
                label.htmlFor = id;
                const teamA = (m.teamAFrags != null) ? m.teamAFrags : '';
                const teamB = (m.teamBFrags != null) ? m.teamBFrags : '';
                label.textContent = `${m.mapName || m.map || ''} ${teamA} - ${teamB}`;
                label.style.marginLeft = '6px';

                const viewLink = document.createElement('a');
                viewLink.href = m.gameUrl || m.mapUrl || '#';
                viewLink.target = '_blank';
                viewLink.textContent = ' view game';
                viewLink.style.marginLeft = '8px';

                wrapper.appendChild(radio);
                wrapper.appendChild(label);
                wrapper.appendChild(viewLink);
                list.appendChild(wrapper);
              });

              // wire up change handler to toggle button
              const radios = Array.from(document.getElementsByName('incmap'));
              radios.forEach(r => r.onchange = function() {
                const btn = document.getElementById('fix-selected-btn');
                if (document.querySelector('input[name="incmap"]:checked')) {
                  btn.disabled = false;
                  btn.style.opacity = '1';
                  btn.style.cursor = 'pointer';
                } else {
                  btn.disabled = true;
                  btn.style.opacity = '0.5';
                  btn.style.cursor = 'not-allowed';
                }
              });
            }
          }
          
          // Only repopulate dropdown if data has changed
          if (dataChanged) {
            // Save current selection
            const currentSelection = dropdown.value;
            
            // Populate dropdown with options
            dropdown.innerHTML = '<option value="">-- Select --</option>';
            result.targets.forEach(function(target) {
              const option = document.createElement('option');
              option.value = target.row;
              option.textContent = target.name;
              dropdown.appendChild(option);
            });
            
            // Restore selection if it still exists in the new options
            if (currentSelection) {
              const optionExists = Array.from(dropdown.options).some(opt => opt.value === currentSelection);
              if (optionExists) {
                dropdown.value = currentSelection;
              }
            }
          }
          
          // Set up onchange handler (only if not already set)
          if (!dropdown.onchange) {
            dropdown.onchange = function() {
              if (dropdown.value) {
                button.disabled = false;
                button.style.opacity = '1';
                button.style.cursor = 'pointer';
              } else {
                button.disabled = true;
                button.style.opacity = '0.5';
                button.style.cursor = 'not-allowed';
              }
            };
          }
          
          // Update button state based on current issue type
          if (result.issueType === 'Incorrect Number of Maps') {
            const selectedRadio = document.querySelector('input[name="incmap"]:checked');
            if (selectedRadio) {
              button.disabled = false;
              button.style.opacity = '1';
              button.style.cursor = 'pointer';
            } else {
              button.disabled = true;
              button.style.opacity = '0.5';
              button.style.cursor = 'not-allowed';
            }
          } else {
            if (dropdown.value) {
              button.disabled = false;
              button.style.opacity = '1';
              button.style.cursor = 'pointer';
            } else {
              button.disabled = true;
              button.style.opacity = '0.5';
              button.style.cursor = 'not-allowed';
            }
          }
          
        } else {
          // Hide dropdown and disable button
          currentIssueData = null;
          dropdownContainer.style.display = 'none';
          button.disabled = true;
          button.style.opacity = '0.5';
          button.style.cursor = 'not-allowed';
          
          // Update status
          status.style.color = '#666';
          status.textContent = result ? result.message : 'No row selected';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to check selection:', error);
      })
      .getSelectedFixMeIssue();
  }

  function fixSelectedIssue() {
    if (!currentIssueData) {
      return;
    }
    
    let targetRow = null;
    // For Incorrect Number of Maps, read selected radio value (gameUrl)
    if (currentIssueData.issueType === 'Incorrect Number of Maps') {
      const sel = document.querySelector('input[name="incmap"]:checked');
      if (!sel || !sel.value) {
        alert('Please select a map to exclude');
        return;
      }
      targetRow = sel.value; // pass URL string through
    } else {
      const dropdown = document.getElementById('fix-target-select');
      targetRow = parseInt(dropdown.value);
      if (!targetRow) {
        alert('Please select a Player or Team from the dropdown');
        return;
      }
    }
    
    const button = document.getElementById('fix-selected-btn');
    const messageBox = document.getElementById('fix-message');
    const loader = document.getElementById('loader-overlay');

    button.disabled = true;
    button.style.opacity = '0.5';
    messageBox.innerText = '';
    messageBox.className = 'form-message';
    loader.style.display = 'flex';

    google.script.run
      .withSuccessHandler(function(response) {
        loader.style.display = 'none';
        messageBox.innerText = response;
        messageBox.classList.add('success');
        
        // Refresh the FIX-ME status after 2 seconds
        setTimeout(() => {
          messageBox.innerText = '';
          messageBox.className = 'form-message';
          refreshFixMeStatus();
          checkFixMeSelection();
        }, 2000);
      })
      .withFailureHandler(function(error) {
        loader.style.display = 'none';
        button.disabled = false;
        button.style.opacity = '1';
        messageBox.innerText = 'Error: ' + error.message;
        messageBox.classList.add('error');
      })
      .fixSelectedFixMeIssue(targetRow);
  }
  
  // ═══════════════════════════════════════════════════════════════════════════
  // Discord Section - Round Selection
  // ═══════════════════════════════════════════════════════════════════════════

  function initDiscordSection() {
    const select = document.getElementById('discordRoundSelect');
    if (!select) return;
    
    select.innerHTML = '<option value="">Loading...</option>';
    
    google.script.run
      .withSuccessHandler(function(scheduleConfig) {
        populateDiscordRoundDropdown(scheduleConfig);
      })
      .withFailureHandler(function(error) {
        select.innerHTML = '<option value="">Error loading rounds</option>';
        console.error('Failed to load schedule config:', error);
      })
      .getScheduleConfigAPI();
  }

  function populateDiscordRoundDropdown(scheduleConfig) {
    const select = document.getElementById('discordRoundSelect');
    if (!select || !scheduleConfig || scheduleConfig.length === 0) {
      select.innerHTML = '<option value="">No rounds found</option>';
      return;
    }
    
    // Clear and populate options
    select.innerHTML = '';
    scheduleConfig.forEach(function(config) {
      const option = document.createElement('option');
      option.value = config.round;
      option.textContent = config.round + ' - Deadline: ' + config.deadline;
      if (config.scheduleInfoSent === 'Yes') {
        option.textContent += ' ✓';
      }
      select.appendChild(option);
    });
    
    // Smart default selection
    const defaultRound = getSmartDefaultRound(scheduleConfig);
    if (defaultRound) {
      select.value = defaultRound;
    }
  }

  function getSmartDefaultRound(scheduleConfig) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    // Parse deadline string (dd/mm/yyyy) to Date
    function parseDeadline(deadlineStr) {
      if (!deadlineStr) return null;
      const parts = String(deadlineStr).split('/');
      if (parts.length !== 3) return null;
      // dd/mm/yyyy -> new Date(yyyy, mm-1, dd)
      return new Date(parts[2], parts[1] - 1, parts[0]);
    }
    
    // Find current round (first deadline >= today)
    let currentRoundIndex = -1;
    for (let i = 0; i < scheduleConfig.length; i++) {
      const deadline = parseDeadline(scheduleConfig[i].deadline);
      if (deadline && deadline >= today) {
        currentRoundIndex = i;
        break;
      }
    }
    
    // If no future deadline found, use last round
    if (currentRoundIndex === -1) {
      return scheduleConfig[scheduleConfig.length - 1].round;
    }
    
    const currentRound = scheduleConfig[currentRoundIndex];
    
    // If current round's Schedule Info Sent is 'Yes', use next round if available
    if (currentRound.scheduleInfoSent === 'Yes') {
      if (currentRoundIndex + 1 < scheduleConfig.length) {
        return scheduleConfig[currentRoundIndex + 1].round;
      }
    }
    
    return currentRound.round;
  }

  function runDiscordTask(functionName) {
    const select = document.getElementById('discordRoundSelect');
    const round = select ? select.value : null;
    
    if (!round) {
      alert('Please select a round first.');
      return;
    }
    
    const loader = document.getElementById('loader-overlay');
    loader.style.display = 'flex';
    
    google.script.run
      .withSuccessHandler(function() {
        loader.style.display = 'none';
      })
      .withFailureHandler(function(msg) {
        loader.style.display = 'none';
        alert('Error: ' + msg);
      })
      [functionName](round);
  }

  //How responsive the admin sidebar is - experiment with values 
  setInterval(checkActiveSheet, 500);
  checkActiveSheet();  
 </script>
