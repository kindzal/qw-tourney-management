<style>
  body {
    font-family: Arial, sans-serif;
    padding: 0px;
    margin: 0px;
  }

  .section {
    display: none;
  }

  h2, h3 {
    margin-top: 0;
  }

  button {
    display: block;
    margin-bottom: 8px;
    width: 100%;
    padding: 6px;
    border: none;
    background-color: #1a73e8;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    max-width: 210px;
  }

  button:hover {
    background-color: #1557b0;
  }

  .active-info {
    font-size: 12px;
    color: #666;
    margin-bottom: 10px;
    text-align: center;
  }

  #currentTab {
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
  }

  .container { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0px; }
  .info-box { background-color: #f0f7ff; border-left: 4px solid #007bff; padding: 3px; margin-bottom: 5px; border-radius: 4px; }
  .manual-steps { background-color: #fff; border: 1px solid #ddd; padding: 5px; border-radius: 8px; }
  .step-list { padding-left: 20px; }
  .step-list li { margin-bottom: 15px; }
  .code-block { background: #f4f4f4; padding: 10px; border-radius: 4px; display: block; font-family: monospace; margin: 10px 0; border: 1px solid #ccc; }
  .note-box { background-color: #fff3cd; border: 1px solid #ffeeba; padding: 5px; margin-top: 10px; border-radius: 4px; }
  .icon { vertical-align: middle; margin-right: 5px; }
  a { color: #007bff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* The background overlay */
  #loader-overlay {
    display: none; /* Hidden by default */
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.15); /* Slightly darker tint for the background */
    z-index: 9000;
    justify-content: center;
    align-items: center;
  }

  /* The Pronounced Card Background */
  .loader-content {
    background: #ffffff;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); /* Soft deep shadow */
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid #eee;
    min-width: 120px;
  }

  /* Updated Text Style */
  .loader-content p {
    margin: 15px 0 0 0;
    font-family: Arial, sans-serif;
    font-size: 16px; /* Slightly smaller for a more professional look */
    font-weight: 600;
    color: #3c4043;
  }

  /* The actual spinner */
  .spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #1a73e8; /* Matches your button blue */
    border-radius: 50%;
    width: 36px;
    height: 36px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Style for Tab references */
.inline-tab {
  background-color: #e8eaed;
  color: #3c4043;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #dadce0;
  font-size: 0.9em;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer; /* Shows the hand icon on hover */
  transition: background-color 0.2s;
}
.inline-tab:hover {
  background-color: #d1d3d6; /* Darkens slightly on hover */
  text-decoration: underline;
}

.inline-tab::before {
  content: '📑'; /* Emoji or use a CSS shape */
  font-size: 10px;
  margin-right: 4px;
  opacity: 0.7;
}

/* Style for Button references */
.inline-btn {
  background-color: #1a73e8;
  color: white;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.85em;
  font-weight: bold;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  white-space: nowrap;
}

.inline-btn::before {
  content: '🖱️'; /* Small mouse/pointer icon */
  font-size: 10px;
  margin-right: 4px;
}

.inline-col {
  background-color: #e6f4ea; /* Light green background */
  color: #137333;           /* Dark green text */
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #ceead6;
  font-size: 0.9em;
  font-weight: 600;
  white-space: nowrap;
}

.inline-col::before {
  content: '📊'; /* Spreadsheet/Column icon */
  font-size: 10px;
  margin-right: 4px;
  opacity: 0.8;
}

/* Style for Cell references */
.inline-cell {
  background-color: #fff9e6; /* Very light yellow */
  color: #b05a00;           /* Amber/Brown text for contrast */
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #ffe194;
  font-size: 0.9em;
  font-weight: 600;
  font-family: 'Roboto Mono', monospace; /* Monospace makes cell coords like A1 look better */
  white-space: nowrap;
}

.inline-cell::before {
  content: '▦'; /* Grid cell icon */
  font-size: 11px;
  margin-right: 4px;
  opacity: 0.8;
  vertical-align: middle;
}

.inline-web {
  background-color: #f3e5f5; /* Light purple */
  color: #7b1fa2;           /* Deep purple text */
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #d1c4e9;
  font-size: 0.9em;
  font-weight: 600;
  white-space: nowrap;
}

.inline-web::before {
  content: '🌐'; /* Globe or use '🔗' */
  font-size: 10px;
  margin-right: 4px;
  opacity: 0.8;
}

/* Optional: if you make it a real link */
a.inline-web {
  text-decoration: none;
  transition: all 0.2s;
}

a.inline-web:hover {
  background-color: #e1bee7;
  text-decoration: underline;
}

/* Style for QWadmin brand name */
.qwadmin-brand {
  background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
  color: #5d4000;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid #daa520;
  font-size: 0.9em;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 1px 3px rgba(218, 165, 32, 0.3);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
}

/* Warning text with red glow */
.warning-glow {
  color: #c00;
  text-shadow: 0 0 8px rgba(255, 0, 0, 0.5), 0 0 15px rgba(255, 0, 0, 0.3);
  font-weight: 700;
}

.copy-container {
  display: flex;
  gap: 5px;
  align-items: center;
}
.cb-input {
  width: 2.5ch; /* 'ch' units match the width of a character */
  text-align: center;
  padding: 5px 0;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.copy-btn {
  width: 10ch; 
  padding: 5px;
  cursor: pointer;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 4px;
  transition: background 0.3s;
  margin-bottom: 0px;
}

.copy-btn:hover {
  background-color: #2980b9;
}

.copy-btn:active {
  background-color: #1c598a;
}
/* Schedule Generator Form */

.form-group {
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  max-width: 240px;
}

.form-group label {
  font-weight: 600;
  margin-bottom: 4px;
}

.form-group select {
  padding: 6px;
  border-radius: 4px;
  border: 1px solid #ccc;
}

.form-message {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
}

.form-message.success {
  color: #137333;
}

.form-message.error {
  color: #d93025;
}

</style>
