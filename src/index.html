<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><?= appTitle ?></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700|Droid+Sans+Mono|Roboto:500">
<?!= HtmlService.createHtmlOutputFromFile('styles').getContent(); ?>
</head>
<body>
<header class="app-header">
  <div class="app-header-main">
    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
    <? if (logoUrl) { ?><img src="<?= logoUrl ?>" class="app-logo"><? } ?>
    <div>
      <h1 class="app-title"><?= appTitle ?></h1>     
    </div>
  </div>
  <? if (wikiUrl) { ?>
  <nav class="app-nav app-nav-left">    
  <? } else { ?>
  <nav class="app-nav"> 
  <? } ?>  
    <button data-target="standings">🏆 Standings</button>
    <button data-target="schedule">📆 Schedule</button>
    <button data-target="teams">👥 Teams</button>
    <button data-target="players">🎯 Ranking</button>
    <? if (hidePlayoffs !== 'Yes') { ?>
      <button data-target="playoffs">🏁 Playoffs</button>
    <? } ?>
    <button data-target="recent">🕒 Recent</button>
    <button data-target="mapstats">🗺️ Map Stats</button>
    <? if (wikiUrl) { ?>
      <a href="<?= wikiUrl ?>" target="_blank" rel="noopener" class="nav-wiki-link">📖 Wiki</a>
    <? } ?>    
  </nav>
</header> 
<div class="popup-overlay" id="popup-overlay"></div>
<div class="team-view-overlay" id="team-view-overlay">
  <div class="team-view-panel">
    <button class="team-view-close" aria-label="Close">&times;</button>
    <div class="team-view-header"></div>
    <div class="team-view-content"></div>
  </div>
</div>
<section id="standings">
  <div class="content-wrapper">
    <div class="section-title">Standings</div>
    <div id="standings-output" class="loading">Loading…</div>
  </div>
</section>
<section id="schedule">
  <div class="content-wrapper">
    <div class="section-title">Schedule</div>
    <div id="round-nav-container" class="loading">Loading…</div>
    <div id="schedule-rounds-container"></div>
  </div>
</section>
<section id="teams">
  <div class="content-wrapper">
    <div class="section-title">Teams</div>
    <div id="teams-output" class="loading">Loading…</div>
  </div>
</section>
<section id="players">
  <div class="content-wrapper">
    <div class="section-title">Player Ranking</div>
    <div id="players-output" class="loading">Loading…</div>
  </div>
</section>
<? if (hidePlayoffs !== 'Yes') { ?>
  <section id="playoffs">
    <div class="content-wrapper">
      <div class="section-title">Playoffs</div>
      <div id="playoffs-output" class="loading">Loading…</div>
    </div>
  </section>
<? } ?>
<section id="recent">
  <div class="content-wrapper">
    <div class="section-title">Recent</div>
    <div id="recent-games-output" class="loading">Loading…</div>
  </div>
</section>
<section id="mapstats">
  <div class="content-wrapper">
    <div class="section-title">Map Statistics</div>
    <div id="mapstats-output" class="loading">Loading…</div>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const baseUrl="<?= baseUrl ?>";
  const defaultPage="<?= defaultPage ?>";
  const rankTooltipText = <?= JSON.stringify(rankTooltipText) ?>;  
  const recentGamesLimit = Number("<?= recentGamesLimit ?>") || 5;
  const hidePlayoffs = "<?= hidePlayoffs ?>";
  let scheduleConfigByRound = {};

  // ==================== TOOLTIPS (rank only atm) ====================
  const rankTooltip = document.createElement("div");
  rankTooltip.className = "rank-tooltip";
  rankTooltip.textContent = rankTooltipText; // SAFE: no HTML injection

  // Prevent clicks inside tooltip from bubbling to overlay
  rankTooltip.addEventListener("click", e => e.stopPropagation());

  document.body.appendChild(rankTooltip);

  // ==================== MOBILE HAMBURGER MENU ====================
  const navToggle = document.querySelector(".nav-toggle");
  const appNav = document.querySelector(".app-nav");
  const navOverlay = document.querySelector(".nav-overlay");

  function closeMobileNav() {
    appNav.classList.remove("open");
    navOverlay.classList.remove("open");
    navToggle.textContent = "☰";
  }

  navToggle.addEventListener("click", () => {
    const isOpen = appNav.classList.toggle("open");
    navOverlay.classList.toggle("open", isOpen);
    navToggle.textContent = isOpen ? "✕" : "☰";
  });

  /* Close when clicking overlay */
  navOverlay.addEventListener("click", closeMobileNav);

  /* Close when clicking a nav item */
  appNav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", closeMobileNav);
  });

  document.querySelectorAll(".app-nav button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
      document.getElementById(btn.dataset.target).classList.add("active");
      document.querySelectorAll(".app-nav button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    };
  });
  const defaultBtn = document.querySelector(`.app-nav button[data-target="${defaultPage}"]`);
  if (defaultBtn) defaultBtn.click();
  
  const overlay = document.getElementById('popup-overlay');
  overlay.addEventListener('click', () => {
    // Close game card popups
    document.querySelectorAll('.bracket-popup-wrapper').forEach(p => p.style.display = 'none');

     // Close rank tooltips
    document.querySelectorAll('.rank-tooltip').forEach(t => t.style.display = 'none');

    overlay.classList.remove('active');    
  });  
  
  const PERCENT_COLUMNS=["Win %","Avg Eff","Avg SG","Avg LG"];
  const LOGO_FALLBACK_URL = 'https://cdn.jsdelivr.net/gh/kindzal/my-assets@master/images/clan-logos/optimised/fallback.png';

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  
  // ==================== TEAM VIEW OVERLAY ====================
  const teamViewOverlay = document.getElementById("team-view-overlay");
  const teamViewPanel = teamViewOverlay.querySelector(".team-view-panel");
  const teamViewHeader = teamViewOverlay.querySelector(".team-view-header");
  const teamViewContent = teamViewOverlay.querySelector(".team-view-content");
  const teamViewClose = teamViewOverlay.querySelector(".team-view-close");

  function closeTeamView() {
    teamViewOverlay.classList.remove("active");
    document.body.style.overflow = "";
  }

  teamViewClose.addEventListener("click", closeTeamView);
  teamViewOverlay.addEventListener("click", (e) => {
    if (e.target === teamViewOverlay) closeTeamView();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && teamViewOverlay.classList.contains("active")) {
      closeTeamView();
    }
  });

  async function showTeamView(teamName) {
    const normalizedName = teamName.toLowerCase().trim();
    
    // Fetch all required data
    const [teams, standings, games] = await Promise.all([
      DataStore.getTeams(),
      DataStore.getStandings(),
      DataStore.getGames()
    ]);

    // Find the team
    const team = teams.find(t => {
      const name = (t['Team Name'] || '').toLowerCase().trim();
      return name === normalizedName;
    });

    if (!team) {
      console.error("Team not found:", teamName);
      return;
    }

    // Find ranking from standings
    const standingsEntry = standings.find(s => {
      const name = (s['Team'] || '').toLowerCase().trim();
      return name === normalizedName;
    });
    const rank = standingsEntry?.Rank || standingsEntry?.['#'] || '?';
    const division = standingsEntry?.Division || '';

    // Get team data
    const teamDisplayName = team['Team Name'] || '';
    const logoUrl = team['logoUrl'] || LOGO_FALLBACK_URL;
    const players = (team['Players'] || '').split(',').map(p => p.trim()).filter(p => p);
    const rawTag = team['Team Tag'] || '';
    const teamTag = Array.isArray(rawTag) ? rawTag.join(' / ') : rawTag;

    // Build header
    teamViewHeader.innerHTML = '';
    
    const headerCard = document.createElement("div");
    headerCard.className = "team-view-card";

    const logoImg = document.createElement("img");
    logoImg.className = "team-view-logo";
    logoImg.src = logoUrl;
    logoImg.alt = teamDisplayName + " logo";
    logoImg.width = 48;
    logoImg.height = 48;
    logoImg.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };

    const infoDiv = document.createElement("div");
    infoDiv.className = "team-view-info";

    const rankLine = document.createElement("div");
    rankLine.className = "team-view-rank";
    if (division) {
      rankLine.innerHTML = `<span class="team-view-division">${division}</span> · RANKED #${rank}`;
    } else {
      rankLine.textContent = `RANKED #${rank}`;
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "team-view-name";
    
    const nameText = document.createElement("span");
    nameText.textContent = teamDisplayName;
    nameDiv.appendChild(nameText);
    
    if (teamTag) {
      const tagSpan = document.createElement("span");
      tagSpan.className = "team-view-tag";
      tagSpan.textContent = teamTag;
      nameDiv.appendChild(tagSpan);
    }

    const playersDiv = document.createElement("div");
    playersDiv.className = "team-view-players";
    players.forEach((player, idx) => {
      if (idx === 0) {
        const captainSpan = document.createElement("span");
        captainSpan.className = "captain-name";
        captainSpan.textContent = player;
        playersDiv.appendChild(captainSpan);
        const badge = document.createElement("span");
        badge.className = "captain-badge";
        badge.textContent = "C";
        badge.title = "Captain";
        playersDiv.appendChild(badge);
      } else {
        playersDiv.appendChild(document.createTextNode(" \u00B7 " + player));
      }
    });

    infoDiv.append(rankLine, nameDiv, playersDiv);
    headerCard.append(logoImg, infoDiv);
    teamViewHeader.appendChild(headerCard);

    // Build content
    teamViewContent.innerHTML = '';

    const teamGames = games.filter(g => {
      const a = (g.teamA || '').toLowerCase().trim();
      const b = (g.teamB || '').toLowerCase().trim();
      return a === normalizedName || b === normalizedName;
    });

    // Build Map Statistics section FIRST
    const playedGames = teamGames.filter(g => g.played && g.maps && g.maps.length > 0);
    if (playedGames.length > 0) {
      const mapStatsSection = document.createElement("div");
      mapStatsSection.className = "team-view-section";
      
      const mapStatsTitle = document.createElement("h3");
      mapStatsTitle.textContent = "Map Statistics";
      mapStatsSection.appendChild(mapStatsTitle);

      // Calculate team map stats
      const mapStats = {};
      let totalMaps = 0;
      let totalFrags = 0;

      // Build a tag lookup map: display name (lowercase) -> tag
      const teamTagMap = {};
      teams.forEach(t => {
        const n = (t['Team Name'] || '').toLowerCase().trim();
        const raw = t['Team Tag'] || '';
        teamTagMap[n] = Array.isArray(raw) ? raw.join(' / ') : raw;
      });

      playedGames.forEach(g => {
        const isTeamA = (g.teamA || '').toLowerCase().trim() === normalizedName;
        
        g.maps.forEach(m => {
          const mapName = m.mapName || 'Unknown';
          if (!mapStats[mapName]) {
            mapStats[mapName] = {
              name: mapName,
              played: 0,
              wins: 0,
              totalFragsFor: 0,
              totalFragsAgainst: 0,
              biggestWin: null,
              biggestLoss: null
            };
          }
          
          const stat = mapStats[mapName];
          stat.played++;
          totalMaps++;
          
          const fragsFor = isTeamA ? (m.teamAFrags || 0) : (m.teamBFrags || 0);
          const fragsAgainst = isTeamA ? (m.teamBFrags || 0) : (m.teamAFrags || 0);
          const opponentName = isTeamA ? (g.teamB) : (g.teamA);
          const opponentLogo = isTeamA ? g.teamBLogoUrl : g.teamALogoUrl;
          const opponentTag = teamTagMap[(opponentName || '').toLowerCase().trim()] || '';
          
          stat.totalFragsFor += fragsFor;
          stat.totalFragsAgainst += fragsAgainst;
          totalFrags += fragsFor;
          
          const fragDiff = fragsFor - fragsAgainst;
          if (fragDiff > 0) stat.wins++;
          
          // Track biggest win
          if (fragDiff > 0 && (!stat.biggestWin || fragDiff > stat.biggestWin.diff)) {
            stat.biggestWin = {
              diff: fragDiff,
              fragsFor,
              fragsAgainst,
              opponent: opponentName,
              opponentLogo,
              opponentTag
            };
          }
          
          // Track biggest loss
          if (fragDiff < 0 && (!stat.biggestLoss || fragDiff < stat.biggestLoss.diff)) {
            stat.biggestLoss = {
              diff: fragDiff,
              fragsFor,
              fragsAgainst,
              opponent: opponentName,
              opponentLogo,
              opponentTag
            };
          }
        });
      });

      // Summary
      const summary = document.createElement("div");
      summary.className = "team-mapstats-summary";
      const uniqueMaps = Object.keys(mapStats).length;
      const avgFrags = totalMaps > 0 ? Math.ceil(totalFrags / totalMaps) : 0;
      summary.innerHTML = `
        <span>🗺️ <strong>${uniqueMaps}</strong> maps played</span>
        <span>·</span>
        <span>🎮 <strong>${totalMaps}</strong> total games</span>
        <span>·</span>
        <span>💥 <strong>${avgFrags}</strong> avg frags/game</span>
      `;
      mapStatsSection.appendChild(summary);

      // Map cards grid
      const mapGrid = document.createElement("div");
      mapGrid.className = "team-mapstats-grid";
      
      const maxPlayed = Math.max(...Object.values(mapStats).map(s => s.played));
      
      Object.values(mapStats)
        .sort((a, b) => b.played - a.played)
        .forEach(stat => {
          const card = document.createElement("div");
          card.className = "team-map-card";
          card.style.backgroundImage = `url('https://a.quake.world/mapshots/webp/sm/${stat.name}.webp')`;
          
          // Map name overlay
          const nameOverlay = document.createElement("div");
          nameOverlay.className = "team-map-card-name";
          nameOverlay.textContent = stat.name;
          card.appendChild(nameOverlay);
          
          // Stats overlay
          const statsOverlay = document.createElement("div");
          statsOverlay.className = "team-map-card-stats";
          
          // Played row with bar
          const playedRow = document.createElement("div");
          playedRow.className = "team-map-stat-row";
          playedRow.innerHTML = `
            <span class="team-map-stat-icon">🎮</span>
            <span class="team-map-stat-label">Played</span>
            <span class="team-map-stat-value">${stat.played}</span>
            <div class="team-map-bar"><div class="team-map-bar-fill" style="width: ${(stat.played / maxPlayed * 100).toFixed(0)}%"></div></div>
          `;
          statsOverlay.appendChild(playedRow);
          
          // Win Rate row
          const winRate = stat.played > 0 ? Math.round((stat.wins / stat.played) * 100) : 0;
          const winRow = document.createElement("div");
          winRow.className = "team-map-stat-row";
          winRow.innerHTML = `
            <span class="team-map-stat-icon">🏆</span>
            <span class="team-map-stat-label">Win Rate</span>
            <span class="team-map-stat-value">${winRate}%</span>
          `;
          statsOverlay.appendChild(winRow);
          
          // Biggest Win row
          if (stat.biggestWin) {
            const bw = stat.biggestWin;
            const bigWinRow = document.createElement("div");
            bigWinRow.className = "team-map-stat-row";
            bigWinRow.innerHTML = `<span class="team-map-stat-icon">📈</span><span class="team-map-stat-label">Top Win</span>`;
            const valueSpan = document.createElement("span");
            valueSpan.className = "team-map-stat-value team-map-vs";
            valueSpan.innerHTML = `
              <span class="team-map-vs-score">${bw.fragsFor} - ${bw.fragsAgainst}</span>
              <span class="team-map-vs-label">vs</span>
              <img class="team-map-vs-logo" src="${bw.opponentLogo || LOGO_FALLBACK_URL}" alt="" onerror="this.src='${LOGO_FALLBACK_URL}'">
              ${bw.opponentTag ? `<span class="team-map-vs-tag">${escapeHtml(bw.opponentTag)}</span>` : ''}
            `;
            bigWinRow.appendChild(valueSpan);
            statsOverlay.appendChild(bigWinRow);
          }
          
          // Biggest Loss row
          if (stat.biggestLoss) {
            const bl = stat.biggestLoss;
            const bigLossRow = document.createElement("div");
            bigLossRow.className = "team-map-stat-row";
            bigLossRow.innerHTML = `<span class="team-map-stat-icon">📉</span><span class="team-map-stat-label">Top Loss</span>`;
            const valueSpan = document.createElement("span");
            valueSpan.className = "team-map-stat-value team-map-vs";
            valueSpan.innerHTML = `
              <span class="team-map-vs-score">${bl.fragsFor} - ${bl.fragsAgainst}</span>
              <span class="team-map-vs-label">vs</span>
              <img class="team-map-vs-logo" src="${bl.opponentLogo || LOGO_FALLBACK_URL}" alt="" onerror="this.src='${LOGO_FALLBACK_URL}'">
              ${bl.opponentTag ? `<span class="team-map-vs-tag">${escapeHtml(bl.opponentTag)}</span>` : ''}
            `;
            bigLossRow.appendChild(valueSpan);
            statsOverlay.appendChild(bigLossRow);
          }
          
          card.appendChild(statsOverlay);
          mapGrid.appendChild(card);
        });
      
      mapStatsSection.appendChild(mapGrid);
      teamViewContent.appendChild(mapStatsSection);
    }

    // Build Games section AFTER Map Statistics
    if (teamGames.length > 0) {
      const gamesSection = document.createElement("div");
      gamesSection.className = "team-view-section";
      
      const gamesTitle = document.createElement("h3");
      gamesTitle.textContent = "Games";
      gamesSection.appendChild(gamesTitle);

      const gamesGrid = document.createElement("div");
      gamesGrid.className = "team-view-games";

      // Sort by schedule config order (reverse: most recent first)
      // Playoffs come before group games, playoffs sorted by stage, group sorted by round descending
      const playoffStageOrder = {
        "Final": 1, "Final B": 2, "Bronze": 3, "Bronze B": 4,
        "Semifinals": 5, "Semifinals B": 6,
        "Quarterfinals": 7
      };
      
      teamGames.sort((a, b) => {
        const aIsPlayoff = a.stage === "Playoff";
        const bIsPlayoff = b.stage === "Playoff";
        
        // Playoffs before group games
        if (aIsPlayoff && !bIsPlayoff) return -1;
        if (!aIsPlayoff && bIsPlayoff) return 1;
        
        if (aIsPlayoff && bIsPlayoff) {
          // Both playoffs: sort by stage order
          const aStage = a.round || a.playoffRound || "";
          const bStage = b.round || b.playoffRound || "";
          const aOrder = playoffStageOrder[aStage] ?? 99;
          const bOrder = playoffStageOrder[bStage] ?? 99;
          return aOrder - bOrder;
        }
        
        // Both group games: sort by round descending
        const aRound = Number(a.round) || 0;
        const bRound = Number(b.round) || 0;
        return bRound - aRound;
      });

      teamGames.forEach(g => gamesGrid.appendChild(buildGameCard(g)));
      gamesSection.appendChild(gamesGrid);
      teamViewContent.appendChild(gamesSection);
    }

    // Show "no games" message if needed
    if (teamGames.length === 0) {
      const noGames = document.createElement("p");
      noGames.className = "team-view-empty";
      noGames.textContent = "No games played yet.";
      teamViewContent.appendChild(noGames);
    }

    // Show overlay
    document.body.style.overflow = "hidden";
    teamViewOverlay.classList.add("active");
  }

  function formatCell(h,v){
    if(PERCENT_COLUMNS.includes(h)){
      if(v==null||v==="") return "";
      if(typeof v==="string" && v.includes("%")) return v;
      const n=Number(v);
      return isNaN(n) ? v : ((n<=1?n*100:n).toFixed(0)+"%");
    }
    return v;
  }

  function attachRankTooltip(iconEl) {
    
    //Auto-close any open tooltip when opening another
    //document.querySelectorAll('.rank-tooltip').forEach(t => t.style.display = 'none');

    const tooltip = document.querySelector(".rank-tooltip");
    if (!tooltip) return;

    iconEl.onclick = e => {
      e.stopPropagation();

      tooltip.style.display = "block";
       overlay.classList.add('active');

      tooltip.style.visibility = "hidden";
      tooltip.style.left = "0px";
      tooltip.style.top = "0px";

      requestAnimationFrame(() => {
        const rect = tooltip.getBoundingClientRect();
        const margin = 10;

        let x = e.clientX + 12; // nudge right (first column)
        let y = e.clientY - rect.height - 12; // above icon

        // Clamp horizontally
        if (x + rect.width > window.innerWidth - margin) {
          x = window.innerWidth - rect.width - margin;
        }

        // Clamp vertically
        if (y < margin) {
          y = e.clientY + 14; // fallback below
        }

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.style.visibility = "visible";
      });
    };

    // Prevent clicks inside tooltip from closing it
    tooltip.onclick = e => e.stopPropagation();
  }

  function renderTable(id, data) {
    const c = document.getElementById(id);
    c.innerHTML = "";

    if (!data?.length) {
      c.textContent = "No data.";
      return;
    }

    const t = document.createElement("table");
    const h = Object.keys(data[0]).filter(col => col !== 'Team Display Name' && col !== 'teamLogoUrl');
    const isStandings = id === 'standings-output';

    /* ---------- THEAD ---------- */
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");

    h.forEach(col => {
      const th = document.createElement("th");

      if (col === "Rank") {
        const wrapper = document.createElement("span");
        wrapper.className = "rank-header";

        const label = document.createElement("span");
        label.textContent = "Rank";

        const icon = document.createElement("span");
        icon.className = "rank-tooltip-icon";
        icon.setAttribute("aria-label", "Rank info");
        icon.textContent = "ℹ️";

        wrapper.append(label, icon);
        th.appendChild(wrapper);

        // Attach tooltip behavior
        attachRankTooltip(icon);
      } else {
        th.textContent = col;
      }

      trHead.appendChild(th);
    });

    thead.appendChild(trHead);
    t.appendChild(thead);

    /* ---------- TBODY ---------- */
    const tbody = document.createElement("tbody");

    data.forEach(row => {
      const tr = document.createElement("tr");

      h.forEach(key => {
        const td = document.createElement("td");
        
        // Special handling for Team column in standings
        if (isStandings && key === 'Team') {
          td.className = 'team-cell team-name-link';
          const logoUrl = row['teamLogoUrl'] || LOGO_FALLBACK_URL;
          const displayName = row['Team'] || '';
          
          const logoImg = document.createElement('img');
          logoImg.className = 'standings-team-logo';
          logoImg.src = logoUrl;
          logoImg.alt = '';
          logoImg.width = 32;
          logoImg.height = 32;
          logoImg.loading = 'lazy';
          logoImg.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
          
          const nameSpan = document.createElement('span');
          nameSpan.textContent = displayName;
          
          td.appendChild(logoImg);
          td.appendChild(nameSpan);
          
          // Make clickable
          td.addEventListener('click', () => showTeamView(displayName));
        } else {
          td.textContent = formatCell(key, row[key]);
        }
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    c.appendChild(t);
  }
  
  function renderStandings(data) {
    const c = document.getElementById("standings-output");
    c.innerHTML = "";
    
    if (!data?.length) {
      c.textContent = "No standings data.";
      return;
    }
    
    const container = document.createElement("div");
    container.className = "standings-container";
    
    const table = document.createElement("table");
    table.className = "standings-table";
    
    // Build header
    const thead = document.createElement("thead");
    thead.innerHTML = `
      <tr>
        <th>#</th>
        <th>Team</th>
        <th>GW - GL</th>
        <th>MW - ML</th>
        <th>DIFF</th>
      </tr>
    `;
    table.appendChild(thead);
    
    // Build body

  const DataStore = {
    _cache: {},
    _promises: {},

    // Fetch data once and cache it
    async _fetch(endpoint) {
      if (this._cache[endpoint] !== undefined) {
        return this._cache[endpoint];
      }
      if (!this._promises[endpoint]) {
        this._promises[endpoint] = fetch(baseUrl + "?endpoint=" + endpoint)
          .then(r => r.json())
          .then(data => {
            this._cache[endpoint] = data;
            return data;
          })
          .catch(e => {
            console.error(`${endpoint} load failed`, e);
            if (endpoint === "allGames") {
              this._cache[endpoint] = [];
            } else if (endpoint === "mapStats") {
              this._cache[endpoint] = { maps: [], totals: {} };
            } else {
              this._cache[endpoint] = null;
            }
            return this._cache[endpoint];
          });
      }
      return this._promises[endpoint];
    },

    // Core data fetchers
    async getGames() { return this._fetch("allGames"); },
    async getTeams() { return this._fetch("teams"); },
    async getStandings() { return this._fetch("standings"); },
    async getPlayers() { return this._fetch("players"); },
    async getScheduleConfig() { return this._fetch("scheduleConfig"); },
    async getMapStats() { return this._fetch("mapStats"); },

    // Derived data helpers
    async getGroupGames() {
      const games = await this.getGames();
      return games.filter(g => g.stage === "Group");
    },

    async getPlayoffGames() {
      const games = await this.getGames();
      return games.filter(g => g.stage === "Playoff");
    },

    async getRecentGames(limit) {
      const games = await this.getGames();
      const played = games.filter(g => !!g.played);
      played.sort((a, b) => getGameDateValue(b) - getGameDateValue(a));
      return limit ? played.slice(0, limit) : played;
    },

    async getGamesByTeam(teamName) {
      const games = await this.getGames();
      const name = teamName.toLowerCase().trim();
      return games.filter(g => 
        (g.teamA || '').toLowerCase().trim() === name || 
        (g.teamB || '').toLowerCase().trim() === name
      );
    },

    // Populate scheduleConfigByRound from fetched data
    async loadScheduleConfig() {
      const data = await this.getScheduleConfig();
      if (data) {
        data.forEach(r => {
          scheduleConfigByRound[String(r.round)] = r;
        });
      }
      return !!data;
    }
  };

  // Find current round based on deadline closest to today (>= today)
  function findCurrentRound(roundKeys) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let closestRound = null;
    let closestDiff = Infinity;

    roundKeys.forEach(round => {
      const config = scheduleConfigByRound[String(round)];
      if (!config || !config.deadline) return;

      const deadlineDate = parseDDMMYYYY(config.deadline);
      if (!deadlineDate) return;

      const diff = deadlineDate.getTime() - today.getTime();

      // Only consider today or future deadlines
      if (diff >= 0 && diff < closestDiff) {
        closestDiff = diff;
        closestRound = round; // return round number directly
      }
    });

    return closestRound; // null if all rounds are past
  }
  
  function parseDDMMYYYY(str) {
    if (!str) return null;

    const match = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!match) return null;

    const day = Number(match[1]);
    const month = Number(match[2]) - 1;
    const year = Number(match[3]);

    const date = new Date(year, month, day);
    date.setHours(0, 0, 0, 0);

    return isNaN(date.getTime()) ? null : date;
  }

  }
  
  function displayStageTitle(stageName) {
    return stageName.replace(/\s+B$/, "");
  }
  
  function renderPlayoffsBracket(allGames) {
    playoffsOut.innerHTML = "";
    if (!allGames?.length) { playoffsOut.textContent = "No playoff games."; return; }
    
    const byRound = {};
    allGames.forEach(g => {
      const r = normalizeStageName(g.round);
      (byRound[r] ??= []).push({ ...g, round: r });
    });
    
    const hasLosers =
      !!byRound["Semifinals B"]?.length ||
      !!byRound["Final B"]?.length ||
      !!byRound["Bronze B"]?.length;
    
    const winnersStages = ["Quarterfinals", "Semifinals", "Final"]
      .filter(stage => (byRound[stage]?.length ?? 0) > 0);
    const losersStages  = ["Semifinals B", "Final B"]
      .filter(stage => (byRound[stage]?.length ?? 0) > 0);
    
    const expected = {
      "Quarterfinals": 4,
      "Semifinals": 2,
      "Final": 1,
      "Bronze": 1,
      "Semifinals B": 2,
      "Final B": 1,
      "Bronze B": 1
    };
    
    function padStage(stageName) {
      const list = (byRound[stageName] || []).slice();
      const want = expected[stageName] ?? list.length;
      while (list.length < want) {
        list.push({
          round: stageName,
          teamA: "",
          teamB: "",
          mapsWonA: "",
          mapsWonB: "",
          played: 0,
          maps: []
        });
      }
      return list;
    }
    
    const wrap = document.createElement("div");
    wrap.className = "playoffs-wrap";
    
    function buildStageRow(title, stages) {
      const container = document.createElement("div");
      if (title) {
        const h = document.createElement("div");
        h.className = "playoffs-title";
        h.textContent = title;
        container.appendChild(h);
      }
      
      const bracket = document.createElement("div");
      bracket.className = "playoffs-bracket";
      const row = document.createElement("div");
      row.className = "stage-row";
      
      stages.forEach(stageName => {
        const col = document.createElement("div");
        col.className = "stage-col stage-" + stageName.toLowerCase().replace(/\s+/g, "-");
        
        const head = document.createElement("div");
        head.className = "stage-header";
        head.textContent = displayStageTitle(stageName);
        col.appendChild(head);
        
        const games = padStage(stageName);
        games.forEach(g => col.appendChild(buildGameCard(g)));
        
        if (stageName === "Final" && byRound["Bronze"]?.length) {
          const sep = document.createElement("div");
          sep.className = "stage-final-separator";
          col.appendChild(sep);
          const bronzeHeader = document.createElement("div");
          bronzeHeader.className = "stage-header stage-bronze-header";
          bronzeHeader.textContent = "Bronze";
          col.appendChild(bronzeHeader);
          padStage("Bronze").forEach(g =>
            col.appendChild(buildGameCard(g))
          );
        }
        
        if (stageName === "Final B" && byRound["Bronze B"]?.length) {
          const sep = document.createElement("div");
          sep.className = "stage-final-b-separator";
          col.appendChild(sep);
          const bronzeHeader = document.createElement("div");
          bronzeHeader.className = "stage-header stage-bronze-header";
          bronzeHeader.textContent = "Bronze";
          col.appendChild(bronzeHeader);
          padStage("Bronze B").forEach(g =>
            col.appendChild(buildGameCard(g))
          );
        }
        
        row.appendChild(col);
      });
      
      bracket.appendChild(row);
      container.appendChild(bracket);
      return container;
    }
    
    if (winnersStages.length) {
      const title = hasLosers ? "Winners Bracket" : null;
      wrap.appendChild(buildStageRow(title, winnersStages));  
    }
    
    const finalGame = (byRound["Final"] || [])[0];
    if (finalGame?.played) {
      const isAWinner = Number(finalGame.mapsWonA) > Number(finalGame.mapsWonB);
      const isBWinner = Number(finalGame.mapsWonB) > Number(finalGame.mapsWonA);
      const winnerDisplayName = isAWinner ? finalGame.teamA :
                                 isBWinner ? finalGame.teamB : "";
      const winnerLogoUrl = isAWinner ? finalGame.teamALogoUrl :
                            isBWinner ? finalGame.teamBLogoUrl : LOGO_FALLBACK_URL;
      if (winnerDisplayName) {
        const finalCol = wrap.querySelector(".stage-final");
        if (finalCol) {
          const finalGameEl = finalCol.querySelector(".bracket-game");
          if (finalGameEl) {
            const row = document.createElement("div");
            row.className = "bracket-final-row";
            finalGameEl.replaceWith(row);
            row.appendChild(finalGameEl);
            const winnerWrap = document.createElement("div");
            winnerWrap.className = "bracket-winner-wrap";
            const badge = document.createElement("div");
            badge.className = "bracket-winner main";
            
            const trophy = document.createElement("span");
            trophy.textContent = "🏆 Winner: ";
            
            const logoImg = document.createElement("img");
            logoImg.className = "bracket-winner-logo";
            logoImg.src = winnerLogoUrl;
            logoImg.alt = "";
            logoImg.width = 48;
            logoImg.height = 48;
            logoImg.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
            
            const nameSpan = document.createElement("span");
            nameSpan.textContent = winnerDisplayName;
            
            badge.appendChild(trophy);
            badge.appendChild(logoImg);
            badge.appendChild(nameSpan);
            winnerWrap.appendChild(badge);
            row.appendChild(winnerWrap);
          }
        }
      }
    }   
    
    if (hasLosers && losersStages.length) {
      wrap.appendChild(buildStageRow("Losers Bracket", losersStages));
      const finalBGame = (byRound["Final B"] || [])[0];
      if (finalBGame?.played) {
        const isAWinner = Number(finalBGame.mapsWonA) > Number(finalBGame.mapsWonB);
        const isBWinner = Number(finalBGame.mapsWonB) > Number(finalBGame.mapsWonA);
        const winnerDisplayName = isAWinner ? finalBGame.teamA :
                                   isBWinner ? finalBGame.teamB : "";
        const winnerLogoUrl = isAWinner ? finalBGame.teamALogoUrl :
                              isBWinner ? finalBGame.teamBLogoUrl : LOGO_FALLBACK_URL;
        if (winnerDisplayName) {
          const finalBCol = wrap.querySelector(".stage-final-b");
          if (finalBCol) {
            const finalGameEl = finalBCol.querySelector(".bracket-game");
            if (finalGameEl) {
              const row = document.createElement("div");
              row.className = "bracket-final-row";
              finalGameEl.replaceWith(row);
              row.appendChild(finalGameEl);
              const winnerWrap = document.createElement("div");
              winnerWrap.className = "bracket-winner-wrap";
              const badge = document.createElement("div");
              badge.className = "bracket-winner losers";
              
              const trophy = document.createElement("span");
              trophy.textContent = "🏆 Winner: ";
              
              const logoImg = document.createElement("img");
              logoImg.className = "bracket-winner-logo";
              logoImg.src = winnerLogoUrl;
              logoImg.alt = "";
              logoImg.width = 48;
              logoImg.height = 48;
              logoImg.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
              
              const nameSpan = document.createElement("span");
              nameSpan.textContent = winnerDisplayName;
              
              badge.appendChild(trophy);
              badge.appendChild(logoImg);
              badge.appendChild(nameSpan);
              winnerWrap.appendChild(badge);
              row.appendChild(winnerWrap);
            }
          }
        }
      }
    }
    
    playoffsOut.appendChild(wrap);
  }
  
  if (hidePlayoffs !== 'Yes') {
    DataStore.getPlayoffGames()
      .then(renderPlayoffsBracket)
      .catch(e => playoffsOut.textContent = "Error loading playoffs: " + e);
  }    

  // ==================== MAP STATS ====================
  const MAP_BAR_COLORS = [
    "#3b82f6", // blue   - most played
    "#8b5cf6", // purple
    "#06b6d4", // cyan
    "#10b981", // green
    "#f59e0b", // amber
    "#ef4444", // red    - least played
  ];

  function buildMapCard(map, maxPlayed) {
    const card = document.createElement("div");
    card.className = "map-card";

    // ---- header: snapshot + map name overlay ----
    const snapWrap = document.createElement("div");
    snapWrap.className = "map-card-snap";

    const img = document.createElement("img");
    img.src = map.mapSnapUrl || "";
    img.alt = map["Map Name"];
    img.className = "map-card-img";
    img.loading = "lazy";

    const nameOverlay = document.createElement("div");
    nameOverlay.className = "map-card-name";
    nameOverlay.textContent = (map["Map Name"] || "").toUpperCase();

    snapWrap.appendChild(img);
    snapWrap.appendChild(nameOverlay);
    card.appendChild(snapWrap);

    // ---- stats body ----
    const body = document.createElement("div");
    body.className = "map-card-body";

    function statRow(icon, label, value, extra) {
      const row = document.createElement("div");
      row.className = "map-stat-row";
      row.innerHTML = `<span class="map-stat-icon">${icon}</span><span class="map-stat-label">${label}</span><span class="map-stat-value">${value}</span>`;
      if (extra) row.appendChild(extra);
      return row;
    }

    // played + progress bar
    const played = map.Played || 0;
    const pct = maxPlayed > 0 ? (played / maxPlayed) * 100 : 0;
    const colorIndex = maxPlayed > 1
      ? Math.round((1 - (played - 1) / (maxPlayed - 1)) * (MAP_BAR_COLORS.length - 1))
      : 0;
    const barColor = MAP_BAR_COLORS[Math.min(colorIndex, MAP_BAR_COLORS.length - 1)];

    const barWrap = document.createElement("div");
    barWrap.className = "map-bar-wrap";
    barWrap.innerHTML = `<div class="map-bar-fill" style="width:${pct}%;background:${barColor}"></div>`;

    const playedRow = statRow("🎮", "Played", played);
    playedRow.appendChild(barWrap);
    body.appendChild(playedRow);

    // total frags
    body.appendChild(statRow("💥", "Total Frags", Math.ceil(map["Total Frags"] || 0)));

    // avg frags
    body.appendChild(statRow("📊", "Avg Frags", Math.ceil(Number(map["Avg Frags"]) || 0)));

    // dominant team
    if (map["Dominant Team"] && map["Dominant Team"].teamName) {
      const dt = map["Dominant Team"];
      const winPct = Math.round(dt.winPercentage || 0);
      const row = statRow("👑", "Dominant Team", "");
      const valueSpan = row.querySelector(".map-stat-value");
      valueSpan.innerHTML = "";
      valueSpan.className = "map-stat-value map-dominant-team";
      
      const teamLink = document.createElement("span");
      teamLink.className = "team-name-link";
      teamLink.addEventListener("click", () => showTeamView(dt.teamName));
      
      const logoImg = document.createElement("img");
      logoImg.className = "map-team-logo";
      logoImg.src = dt.teamLogoUrl || LOGO_FALLBACK_URL;
      logoImg.alt = "";
      logoImg.width = 16;
      logoImg.height = 16;
      logoImg.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
      
      const nameSpan = document.createElement("span");
      nameSpan.textContent = dt.teamName || "";
      
      teamLink.append(logoImg, nameSpan);
      
      const pctSpan = document.createElement("span");
      pctSpan.className = "map-stat-accent";
      pctSpan.textContent = ` ${winPct}% wins`;
      
      valueSpan.append(teamLink, pctSpan);
      body.appendChild(row);
    } else {
      body.appendChild(statRow("👑", "Dominant Team", "—"));
    }

    // highest frag game
    if (map["Highest Frag Game"] && map["Highest Frag Game"].gameUrl) {
      const hf = map["Highest Frag Game"];
      const row = statRow("🔥", "Highest Frags", "");
      const valueSpan = row.querySelector(".map-stat-value");
      valueSpan.innerHTML = "";
      
      const link = document.createElement("a");
      link.href = hf.gameUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "map-game-link map-game-link-logos";
      
      // Team A: [logo] Name Score
      const logoA = document.createElement("img");
      logoA.className = "map-team-logo";
      logoA.src = hf.teamLogoUrlA || LOGO_FALLBACK_URL;
      logoA.alt = "";
      logoA.width = 16;
      logoA.height = 16;
      logoA.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
      
      const nameA = document.createElement("span");
      nameA.textContent = hf.teamNameA || "";
      
      const scoreA = document.createElement("span");
      scoreA.className = "map-game-score";
      scoreA.textContent = hf.fragsA;
      
      const vs = document.createElement("span");
      vs.className = "map-game-vs";
      vs.textContent = "vs";
      
      const scoreB = document.createElement("span");
      scoreB.className = "map-game-score";
      scoreB.textContent = hf.fragsB;
      
      const nameB = document.createElement("span");
      nameB.textContent = hf.teamNameB || "";
      
      const logoB = document.createElement("img");
      logoB.className = "map-team-logo";
      logoB.src = hf.teamLogoUrlB || LOGO_FALLBACK_URL;
      logoB.alt = "";
      logoB.width = 16;
      logoB.height = 16;
      logoB.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
      
      link.append(logoA, nameA, scoreA, vs, scoreB, nameB, logoB);
      valueSpan.appendChild(link);
      body.appendChild(row);
    } else {
      body.appendChild(statRow("🔥", "Highest Frags", "—"));
    }

    // most one-sided game
    if (map["Most One-Sided Game"] && map["Most One-Sided Game"].gameUrl) {
      const os = map["Most One-Sided Game"];
      const row = statRow("⚡", "Most One-Sided", "");
      const valueSpan = row.querySelector(".map-stat-value");
      valueSpan.innerHTML = "";
      
      const link = document.createElement("a");
      link.href = os.gameUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "map-game-link map-game-link-logos";
      
      // Team A: [logo] Name Score
      const logoA = document.createElement("img");
      logoA.className = "map-team-logo";
      logoA.src = os.teamLogoUrlA || LOGO_FALLBACK_URL;
      logoA.alt = "";
      logoA.width = 16;
      logoA.height = 16;
      logoA.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
      
      const nameA = document.createElement("span");
      nameA.textContent = os.teamNameA || "";
      
      const scoreA = document.createElement("span");
      scoreA.className = "map-game-score";
      scoreA.textContent = os.fragsA;
      
      const vs = document.createElement("span");
      vs.className = "map-game-vs";
      vs.textContent = "vs";
      
      const scoreB = document.createElement("span");
      scoreB.className = "map-game-score";
      scoreB.textContent = os.fragsB;
      
      const nameB = document.createElement("span");
      nameB.textContent = os.teamNameB || "";
      
      const logoB = document.createElement("img");
      logoB.className = "map-team-logo";
      logoB.src = os.teamLogoUrlB || LOGO_FALLBACK_URL;
      logoB.alt = "";
      logoB.width = 16;
      logoB.height = 16;
      logoB.onerror = function() { this.src = LOGO_FALLBACK_URL; this.onerror = null; };
      
      link.append(logoA, nameA, scoreA, vs, scoreB, nameB, logoB);
      valueSpan.appendChild(link);
      body.appendChild(row);
    } else {
      body.appendChild(statRow("⚡", "Most One-Sided", "—"));
    }

    card.appendChild(body);
    return card;
  }

  function renderMapStats(data) {
    const out = document.getElementById("mapstats-output");
    out.innerHTML = "";

    if (!data || !data.maps) {
      out.textContent = "No map data.";
      return;
    }

    // Summary header
    const summary = document.createElement("div");
    summary.className = "mapstats-summary";
    summary.innerHTML = `
      <span class="mapstats-summary-item">🗺️ <strong>${data.maps.filter(m => m.Played > 0).length}</strong> maps played</span>
      <span class="mapstats-summary-sep">·</span>
      <span class="mapstats-summary-item">🎮 <strong>${data.totals?.totalPlayed ?? 0}</strong> total games</span>
      <span class="mapstats-summary-sep">·</span>
      <span class="mapstats-summary-item">💥 <strong>${Math.ceil(data.totals?.avgFrags ?? 0)}</strong> avg frags/game</span>
    `;
    out.appendChild(summary);

    // grid of cards
    const grid = document.createElement("div");
    grid.className = "mapstats-grid";

    const maxPlayed = Math.max(...data.maps.map(m => m.Played || 0));

    data.maps.forEach(map => {
      grid.appendChild(buildMapCard(map, maxPlayed));
    });

    out.appendChild(grid);
  }

  DataStore.getMapStats()
    .then(renderMapStats)
    .catch(e => {
      document.getElementById("mapstats-output").textContent = "Error loading map stats: " + e;
    });

  // ==================== MOBILE SWIPE NAVIGATION ====================
  (function enableSwipeNavigation() {
    if (!window.matchMedia("(max-width: 768px)").matches) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const SWIPE_THRESHOLD = 60;     // px
    const VERTICAL_LIMIT = 80;      // px

    const navButtons = Array.from(document.querySelectorAll(".app-nav button"));

    function getActiveIndex() {
      return navButtons.findIndex(btn => btn.classList.contains("active"));
    }

    function goToIndex(idx) {
      if (idx < 0 || idx >= navButtons.length) return;
      closeMobileNav();
      navButtons[idx].click();
    }

    document.addEventListener("touchstart", e => {      
      if (e.target.closest('.bracket-popup-wrapper')) return;
      if (e.touches.length !== 1) return;

      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });

    document.addEventListener("touchend", e => {      
      if (e.target.closest('.bracket-popup-wrapper')) return;
      const t = e.changedTouches[0];
      touchEndX = t.clientX;
      touchEndY = t.clientY;

      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      // Ignore mostly vertical gestures (scroll)
      if (Math.abs(dy) > Math.abs(dx)) return;
      if (Math.abs(dx) < SWIPE_THRESHOLD) return;
      if (Math.abs(dy) > VERTICAL_LIMIT) return;

      const activeIndex = getActiveIndex();
      if (activeIndex === -1) return;

      closeMobileNav();
      if (dx < 0) {
        // Swipe left → next section
        appNav?.classList.remove("open");
        navToggle && (navToggle.textContent = "☰");
        goToIndex(activeIndex + 1);
      } else {
        // Swipe right → previous section
        appNav?.classList.remove("open");
        navToggle && (navToggle.textContent = "☰");
        goToIndex(activeIndex - 1);
      }
    }, { passive: true });
  })();
});
</script>
<div class="nav-overlay"></div>
</body>
