<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><?= appTitle ?></title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700|Droid+Sans+Mono|Roboto:500">
<?!= HtmlService.createHtmlOutputFromFile('styles').getContent(); ?>
</head>
<body>
<header class="app-header">
  <div class="app-header-main">
    <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
    <? if (logoUrl) { ?><img src="<?= logoUrl ?>" class="app-logo"><? } ?>
    <div>
      <h1 class="app-title"><?= appTitle ?></h1>     
    </div>
  </div>
  <? if (wikiUrl) { ?>
  <nav class="app-nav app-nav-left">    
  <? } else { ?>
  <nav class="app-nav"> 
  <? } ?>  
    <button data-target="standings">🏆 Standings</button>
    <button data-target="schedule">📆 Schedule</button>
    <button data-target="teams">👥 Teams</button>
    <button data-target="players">🎯 Ranking</button>
    <? if (hidePlayoffs !== 'Yes') { ?>
      <button data-target="playoffs">🏁 Playoffs</button>
    <? } ?>
    <button data-target="recent">🕒 Recent</button>
    <button data-target="mapstats">🗺️ Map Stats</button>
    <? if (wikiUrl) { ?>
      <a href="<?= wikiUrl ?>" target="_blank" rel="noopener" class="nav-wiki-link">📖 Wiki</a>
    <? } ?>    
  </nav>
</header> 
<div class="popup-overlay" id="popup-overlay"></div>
<section id="standings">
  <div class="content-wrapper">
    <div class="section-title">Standings</div>
    <div id="standings-output" class="loading">Loading…</div>
  </div>
</section>
<section id="schedule">
  <div class="content-wrapper">
    <div class="section-title">Schedule</div>
    <div id="round-nav-container" class="loading">Loading…</div>
    <div id="schedule-rounds-container"></div>
  </div>
</section>
<section id="teams">
  <div class="content-wrapper">
    <div class="section-title">Teams</div>
    <div id="teams-output" class="loading">Loading…</div>
  </div>
</section>
<section id="players">
  <div class="content-wrapper">
    <div class="section-title">Player Ranking</div>
    <div id="players-output" class="loading">Loading…</div>
  </div>
</section>
<? if (hidePlayoffs !== 'Yes') { ?>
  <section id="playoffs">
    <div class="content-wrapper">
      <div class="section-title">Playoffs</div>
      <div id="playoffs-output" class="loading">Loading…</div>
    </div>
  </section>
<? } ?>
<section id="recent">
  <div class="content-wrapper">
    <div class="section-title">Recent</div>
    <div id="recent-games-output" class="loading">Loading…</div>
  </div>
</section>
<section id="mapstats">
  <div class="content-wrapper">
    <div class="section-title">Map Statistics</div>
    <div id="mapstats-output" class="loading">Loading…</div>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const baseUrl="<?= baseUrl ?>";
  const defaultPage="<?= defaultPage ?>";
  const rankTooltipText = <?= JSON.stringify(rankTooltipText) ?>;  
  const recentGamesLimit = Number("<?= recentGamesLimit ?>") || 5;
  const hidePlayoffs = "<?= hidePlayoffs ?>";
  let scheduleConfigByRound = {};

  // ==================== TOOLTIPS (rank only atm) ====================
  const rankTooltip = document.createElement("div");
  rankTooltip.className = "rank-tooltip";
  rankTooltip.textContent = rankTooltipText; // SAFE: no HTML injection

  // Prevent clicks inside tooltip from bubbling to overlay
  rankTooltip.addEventListener("click", e => e.stopPropagation());

  document.body.appendChild(rankTooltip);

  // ==================== MOBILE HAMBURGER MENU ====================
  const navToggle = document.querySelector(".nav-toggle");
  const appNav = document.querySelector(".app-nav");
  const navOverlay = document.querySelector(".nav-overlay");

  function closeMobileNav() {
    appNav.classList.remove("open");
    navOverlay.classList.remove("open");
    navToggle.textContent = "☰";
  }

  navToggle.addEventListener("click", () => {
    const isOpen = appNav.classList.toggle("open");
    navOverlay.classList.toggle("open", isOpen);
    navToggle.textContent = isOpen ? "✕" : "☰";
  });

  /* Close when clicking overlay */
  navOverlay.addEventListener("click", closeMobileNav);

  /* Close when clicking a nav item */
  appNav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", closeMobileNav);
  });

  document.querySelectorAll(".app-nav button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
      document.getElementById(btn.dataset.target).classList.add("active");
      document.querySelectorAll(".app-nav button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    };
  });
  const defaultBtn = document.querySelector(`.app-nav button[data-target="${defaultPage}"]`);
  if (defaultBtn) defaultBtn.click();
  
  const overlay = document.getElementById('popup-overlay');
  overlay.addEventListener('click', () => {
    // Close game card popups
    document.querySelectorAll('.bracket-popup-wrapper').forEach(p => p.style.display = 'none');

     // Close rank tooltips
    document.querySelectorAll('.rank-tooltip').forEach(t => t.style.display = 'none');

    overlay.classList.remove('active');    
  });  
  
  const PERCENT_COLUMNS=["Win %","Avg Eff","Avg SG","Avg LG"];
  function formatCell(h,v){
    if(PERCENT_COLUMNS.includes(h)){
      if(v==null||v==="") return "";
      if(typeof v==="string" && v.includes("%")) return v;
      const n=Number(v);
      return isNaN(n) ? v : ((n<=1?n*100:n).toFixed(0)+"%");
    }
    return v;
  }

  function attachRankTooltip(iconEl) {
    
    //Auto-close any open tooltip when opening another
    //document.querySelectorAll('.rank-tooltip').forEach(t => t.style.display = 'none');

    const tooltip = document.querySelector(".rank-tooltip");
    if (!tooltip) return;

    iconEl.onclick = e => {
      e.stopPropagation();

      tooltip.style.display = "block";
       overlay.classList.add('active');

      tooltip.style.visibility = "hidden";
      tooltip.style.left = "0px";
      tooltip.style.top = "0px";

      requestAnimationFrame(() => {
        const rect = tooltip.getBoundingClientRect();
        const margin = 10;

        let x = e.clientX + 12; // nudge right (first column)
        let y = e.clientY - rect.height - 12; // above icon

        // Clamp horizontally
        if (x + rect.width > window.innerWidth - margin) {
          x = window.innerWidth - rect.width - margin;
        }

        // Clamp vertically
        if (y < margin) {
          y = e.clientY + 14; // fallback below
        }

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
        tooltip.style.visibility = "visible";
      });
    };

    // Prevent clicks inside tooltip from closing it
    tooltip.onclick = e => e.stopPropagation();
  }

  function renderTable(id, data) {
    const c = document.getElementById(id);
    c.innerHTML = "";

    if (!data?.length) {
      c.textContent = "No data.";
      return;
    }

    const t = document.createElement("table");
    const h = Object.keys(data[0]);

    /* ---------- THEAD ---------- */
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");

    h.forEach(col => {
      const th = document.createElement("th");

      if (col === "Rank") {
        const wrapper = document.createElement("span");
        wrapper.className = "rank-header";

        const label = document.createElement("span");
        label.textContent = "Rank";

        const icon = document.createElement("span");
        icon.className = "rank-tooltip-icon";
        icon.setAttribute("aria-label", "Rank info");
        icon.textContent = "ℹ️";

        wrapper.append(label, icon);
        th.appendChild(wrapper);

        // Attach tooltip behavior
        attachRankTooltip(icon);
      } else {
        th.textContent = col;
      }

      trHead.appendChild(th);
    });

    thead.appendChild(trHead);
    t.appendChild(thead);

    /* ---------- TBODY ---------- */
    const tbody = document.createElement("tbody");

    data.forEach(row => {
      const tr = document.createElement("tr");

      h.forEach(key => {
        const td = document.createElement("td");
        td.textContent = formatCell(key, row[key]);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    t.appendChild(tbody);
    c.appendChild(t);
  }
  
  function renderTeamsQWickyStyle(data) {
    const c = document.getElementById("teams-output");
    c.innerHTML = "";
    if (!data?.length) { c.textContent = "No teams."; return; }
    
    const grid = document.createElement("div");
    grid.className = "teams-grid";
    
    data.forEach(team => {
      const card = document.createElement("div");
      card.className = "team-card";
      
      const teamName = team['Team Name'] || team['Team'] || '';
      const teamTag = team['Team Tag Display'] || team['Tag'] || '';
      const players = team['Players'] || '';
      
      // Team name
      const nameDiv = document.createElement("div");
      nameDiv.className = "team-name";
      nameDiv.textContent = teamName;

      // Team tag
      const tagDiv = document.createElement("div");
      tagDiv.className = "team-tag";
      tagDiv.textContent = "Tag: ";

      const tagSpan = document.createElement("span");
      tagSpan.textContent = teamTag;
      tagDiv.appendChild(tagSpan);

      // Team players
      const playersDiv = document.createElement("div");
      playersDiv.className = "team-players";
      playersDiv.textContent = "Players: ";

      const playersSpan = document.createElement("span");
      playersSpan.textContent = players;
      playersDiv.appendChild(playersSpan);

      // Assemble card
      card.append(nameDiv, tagDiv, playersDiv);
            
      grid.appendChild(card);
    });
    
    c.appendChild(grid);
  }
  
  // ==================== DATA FETCH ====================
  const scheduleConfigPromise = fetch(baseUrl + "?endpoint=scheduleConfig")
    .then(r => r.json())
    .then(data => {
      data.forEach(r => {
        scheduleConfigByRound[String(r.round)] = r;
      });
      return true;
    })
    .catch(e => {
      console.error("ScheduleConfig load failed", e);
      return false;
    });

  const groupGamesPromise = fetch(baseUrl + "?endpoint=groupGames")
    .then(r => r.json())
    .catch(e => {
      console.error("GroupGames load failed", e);
      return [];
    });
  fetch(baseUrl+"?endpoint=teams").then(r=>r.json()).then(d=>renderTeamsQWickyStyle(d));
  fetch(baseUrl+"?endpoint=standings").then(r=>r.json()).then(d=>renderTable("standings-output",d));
  fetch(baseUrl+"?endpoint=players")
    .then(r => r.json())
    .then(data => {
      renderTable("players-output", data);
      if (window.matchMedia("(max-width: 768px)").matches) {
        const container = document.getElementById("players-output");
        const table = container.querySelector("table");
        if (!table) return;
        const btn = document.createElement("button");
        btn.className = "players-toggle";
        btn.textContent = "Show more stats";
        btn.onclick = () => {
          const expanded = table.classList.toggle("show-all-cols");
          btn.textContent = expanded ? "Show fewer stats" : "Show more stats";
        };
        container.insertBefore(btn, table);
      }
    })
    .catch(e => {
      document.getElementById("players-output").textContent = "Error loading players: " + e;
    });
  
  function buildGameCard(g) {
    const card = document.createElement("div");
    card.className = "bracket-game";
    const match = document.createElement("div");
    match.className = "bracket-match";
    if (!g.played) match.classList.add("unplayed");
    
    const a = document.createElement("div");
    const aWinner = Number(g.mapsWonA) > Number(g.mapsWonB);
    a.className = "bracket-player" + (aWinner ? " winner" : "");
    a.innerHTML = `<span>${g.teamA || ""}</span><span class="bracket-score">${g.mapsWonA ?? ""}</span>`;
    
    const b = document.createElement("div");
    const bWinner = Number(g.mapsWonB) > Number(g.mapsWonA);
    b.className = "bracket-player" + (bWinner ? " winner" : "");
    b.innerHTML = `<span>${g.teamB || ""}</span><span class="bracket-score">${g.mapsWonB ?? ""}</span>`;
    
    if (g.played) {
      if (aWinner) a.classList.add("advanced");
      if (bWinner) b.classList.add("advanced");
    }
    
    let info;
    const isWalkover = g.played && (!g.maps || g.maps.length === 0);
    const hasMapData = g.played && g.maps && g.maps.length > 0;

    if (isWalkover) {
      info = document.createElement("span");
      info.className = "walkover-icon";
      info.textContent = "🏳️"; // White flag for walkover
    } else if (hasMapData) {
      info = document.createElement("span");
      info = document.createElement("span");
      info.className = "info-icon";
      info.textContent = "ℹ️";
    } else if (g.date) {
      info = document.createElement("div");
      info.className = "info-scheduled-wrap";

      const icon = document.createElement("span");
      icon.className = "info-scheduled-icon";
      icon.textContent = "📢";

      const label = document.createElement("span");
      label.className = "info-scheduled";
      label.textContent = g.date;

      info.appendChild(icon);
      info.appendChild(label);
    } else {
        info = document.createElement("span");
        info.className = "info-icon disabled";
        info.textContent = "ℹ️";
    }    
    
    const popup = document.createElement("div");
    popup.className = "bracket-popup-wrapper";
    popup.innerHTML = `<div class="bracket-popup-header"><div>${g.teamA || ""}</div><div>${g.teamB || ""}</div></div>`;
    (g.maps || []).forEach(m => {
      popup.innerHTML += `
        <div class="bracket-popup-body-match">
          <span class="bracket-score" style="font-weight:${m.teamAFrags>m.teamBFrags?'bold':'normal'}">${m.teamAFrags}</span>
          <a class="map-name" href="${m.gameUrl}" target="_blank" rel="noopener">${m.mapName}</a>
          <span class="bracket-score" style="font-weight:${m.teamBFrags>m.teamAFrags?'bold':'normal'}">${m.teamBFrags}</span>
        </div>`;
    });
    
    if (hasMapData) {
      info.onclick = e => {
        e.stopPropagation();

        // Close any other open popups
        document.querySelectorAll('.bracket-popup-wrapper').forEach(p => {
          if (p !== popup) p.style.display = 'none';
        });

        popup.style.display = "block";
        overlay.classList.add("active");

        // Measure popup
        popup.style.visibility = "hidden";
        popup.style.left = "0px";
        popup.style.top = "0px";

        requestAnimationFrame(() => {
          const rect = popup.getBoundingClientRect();
          const margin = 12;

          let x = e.clientX;
          let y = e.clientY;

          // Prefer above the tap/click
          x -= rect.width / 2;
          y -= rect.height + 16;

          // Clamp horizontally
          if (x < margin) x = margin;
          if (x + rect.width > window.innerWidth - margin) {
            x = window.innerWidth - rect.width - margin;
          }

          // Clamp vertically
          if (y < margin) {
            y = e.clientY + 16; // fallback below
          }
          if (y + rect.height > window.innerHeight - margin) {
            y = window.innerHeight - rect.height - margin;
          }

          /*const isMobile = window.matchMedia("(max-width: 768px)").matches;

          if (isMobile) {
            y = window.innerHeight - rect.height - 24;
            x = (window.innerWidth - rect.width) / 2;
          }*/

          popup.style.left = `${x}px`;
          popup.style.top = `${y}px`;
          popup.style.visibility = "visible";
        });
      };
    }
    
    match.append(a, info, b);
    document.body.appendChild(popup);
    card.appendChild(match);
    return card;
  }
  
  const recentOut = document.getElementById("recent-games-output");
  
  function getGameDateValue(g) {
    const raw = g.Date || g.date || "";      
    const t = Date.parse(raw);
    return isNaN(t) ? 0 : t;
  }
  
  function formatShortDate(g) {
    const raw = g.Date || g.date || "";      
    const t = Date.parse(raw);
    if (isNaN(t)) return "";
    const d = new Date(t);
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }
      
  function renderRecentGames(recentGames) {
    recentOut.innerHTML = "";
    if (!recentGames?.length) {
      recentOut.textContent = "No recent games.";
      return;
    }   
    
    const wrap = document.createElement("div");
    wrap.className = "recent-games";  
    
    recentGames.forEach(g => wrap.appendChild(buildGameCard(g)));
    
    recentOut.appendChild(wrap);        
  }
  
  Promise.allSettled([
    fetch(baseUrl + "?endpoint=allGames").then(r => r.json())    
  ]).then(results => {
    const all = [];
    results.forEach(res => {
      if (res.status === "fulfilled" && Array.isArray(res.value)) {
        all.push(...res.value);
      }
    });
    const played = all.filter(g => !!g.played);
    played.sort((a, b) => getGameDateValue(b) - getGameDateValue(a));

    const initial = played.slice(0, recentGamesLimit);
    const rest = played.slice(recentGamesLimit);

    renderRecentGames(initial);        

    if (rest.length) {
      const hiddenContainer = document.createElement("div");
      hiddenContainer.className = "recent-hidden";
      hiddenContainer.style.display = "none";
      
      rest.forEach(g => hiddenContainer.appendChild(buildGameCard(g)));
      
      const toggle = document.createElement("div");
      toggle.className = "recent-show-more";
      toggle.textContent = "Show more games";
      toggle.onclick = () => {
        const isOpen = hiddenContainer.style.display === "flex";
        hiddenContainer.style.display = isOpen ? "none" : "flex";
        toggle.textContent = isOpen ? "Show more games" : "Show fewer games";
      };
            
      recentOut.appendChild(hiddenContainer);      
      recentOut.appendChild(toggle);
    }
  }).catch(e => {
    recentOut.textContent = "Error loading recent games: " + e;
  });  
  
  const scheduleRoundsContainer = document.getElementById("schedule-rounds-container");
  const roundNavContainer = document.getElementById("round-nav-container");
  
  // Find current round based on deadline closest to today (>= today)
  function findCurrentRound(roundKeys) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let closestRound = null;
    let closestDiff = Infinity;

    roundKeys.forEach(round => {
      const config = scheduleConfigByRound[String(round)];
      if (!config || !config.deadline) return;

      const deadlineDate = parseDDMMYYYY(config.deadline);
      if (!deadlineDate) return;

      const diff = deadlineDate.getTime() - today.getTime();

      // Only consider today or future deadlines
      if (diff >= 0 && diff < closestDiff) {
        closestDiff = diff;
        closestRound = round; // return round number directly
      }
    });

    return closestRound; // null if all rounds are past
  }
  
  function parseDDMMYYYY(str) {
    if (!str) return null;

    const match = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!match) return null;

    const day = Number(match[1]);
    const month = Number(match[2]) - 1;
    const year = Number(match[3]);

    const date = new Date(year, month, day);
    date.setHours(0, 0, 0, 0);

    return isNaN(date.getTime()) ? null : date;
  }
    
  Promise.all([scheduleConfigPromise, groupGamesPromise])
    .then(([configOk, data]) => {
      scheduleRoundsContainer.innerHTML="";
      roundNavContainer.innerHTML="";
      
      if(!data?.length){ 
        scheduleRoundsContainer.textContent="No matches."; 
        return; 
      }
      
      const rounds = {};
      data.forEach(g => {
        const rk = String(g.round ?? "").trim();
        if (!rk) return;
        if (isNaN(Number(rk))) return;
        (rounds[rk] ??= []).push(g);
      });
      
      const roundKeys = Object.keys(rounds).sort((a,b)=>Number(a)-Number(b));
      
      // Determine which round to show by default
      const defaultRound = findCurrentRound(roundKeys);
      
      const nav = document.createElement("div");
      nav.className = "round-nav";
      
      roundKeys.forEach((round) => {
        const btn = document.createElement("button");
        btn.textContent = `R${round}`;
        btn.dataset.round = round;
        
        // Compare round number directly
        if (round === defaultRound) {
          btn.classList.add("active");
        }
              
        btn.onclick = () => {
          document.querySelectorAll(".round-nav button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.querySelectorAll(".round-block").forEach(c => c.classList.remove("active"));
          document.getElementById(`round-${round}`).classList.add("active");
        };
        
        nav.appendChild(btn);
      });
      
      roundNavContainer.appendChild(nav);
      
      roundKeys.forEach((round) => {
        const rb = document.createElement("div");
        rb.className = "round-block";
        rb.id = `round-${round}`;
        if (round === defaultRound) rb.classList.add("active");
        
        const deadlineText = scheduleConfigByRound[String(round)]?.deadline || "";
        rb.innerHTML = `
          <div class="round-header">
            Round ${round}
            ${deadlineText ? `<span class="round-deadline">Deadline: ${deadlineText}</span>` : ""}
          </div>
        `;
        
        const games = document.createElement("div");
        games.className = "round-games";
        rounds[round].forEach(g => {
          games.appendChild(buildGameCard(g));
        });
        rb.appendChild(games);
        scheduleRoundsContainer.appendChild(rb);
      });
    });
  
  const playoffsOut = document.getElementById("playoffs-output");
  
  function normalizeStageName(name) {
    return String(name || "")
      .replace(/\s+/g, " ")
      .trim()
      .replace(/\s+A$/i, "");
  }
  
  function displayStageTitle(stageName) {
    return stageName.replace(/\s+B$/, "");
  }
  
  function renderPlayoffsBracket(allGames) {
    playoffsOut.innerHTML = "";
    if (!allGames?.length) { playoffsOut.textContent = "No playoff games."; return; }
    
    const byRound = {};
    allGames.forEach(g => {
      const r = normalizeStageName(g.round);
      (byRound[r] ??= []).push({ ...g, round: r });
    });
    
    const hasLosers =
      !!byRound["Semifinals B"]?.length ||
      !!byRound["Final B"]?.length ||
      !!byRound["Bronze B"]?.length;
    
    const winnersStages = ["Quarterfinals", "Semifinals", "Final"]
      .filter(stage => (byRound[stage]?.length ?? 0) > 0);
    const losersStages  = ["Semifinals B", "Final B"]
      .filter(stage => (byRound[stage]?.length ?? 0) > 0);
    
    const expected = {
      "Quarterfinals": 4,
      "Semifinals": 2,
      "Final": 1,
      "Bronze": 1,
      "Semifinals B": 2,
      "Final B": 1,
      "Bronze B": 1
    };
    
    function padStage(stageName) {
      const list = (byRound[stageName] || []).slice();
      const want = expected[stageName] ?? list.length;
      while (list.length < want) {
        list.push({
          round: stageName,
          teamA: "",
          teamB: "",
          mapsWonA: "",
          mapsWonB: "",
          played: 0,
          maps: []
        });
      }
      return list;
    }
    
    const wrap = document.createElement("div");
    wrap.className = "playoffs-wrap";
    
    function buildStageRow(title, stages) {
      const container = document.createElement("div");
      if (title) {
        const h = document.createElement("div");
        h.className = "playoffs-title";
        h.textContent = title;
        container.appendChild(h);
      }
      
      const bracket = document.createElement("div");
      bracket.className = "playoffs-bracket";
      const row = document.createElement("div");
      row.className = "stage-row";
      
      stages.forEach(stageName => {
        const col = document.createElement("div");
        col.className = "stage-col stage-" + stageName.toLowerCase().replace(/\s+/g, "-");
        
        const head = document.createElement("div");
        head.className = "stage-header";
        head.textContent = displayStageTitle(stageName);
        col.appendChild(head);
        
        const games = padStage(stageName);
        games.forEach(g => col.appendChild(buildGameCard(g)));
        
        if (stageName === "Final" && byRound["Bronze"]?.length) {
          const sep = document.createElement("div");
          sep.className = "stage-final-separator";
          col.appendChild(sep);
          const bronzeHeader = document.createElement("div");
          bronzeHeader.className = "stage-header stage-bronze-header";
          bronzeHeader.textContent = "Bronze";
          col.appendChild(bronzeHeader);
          padStage("Bronze").forEach(g =>
            col.appendChild(buildGameCard(g))
          );
        }
        
        if (stageName === "Final B" && byRound["Bronze B"]?.length) {
          const sep = document.createElement("div");
          sep.className = "stage-final-b-separator";
          col.appendChild(sep);
          const bronzeHeader = document.createElement("div");
          bronzeHeader.className = "stage-header stage-bronze-header";
          bronzeHeader.textContent = "Bronze";
          col.appendChild(bronzeHeader);
          padStage("Bronze B").forEach(g =>
            col.appendChild(buildGameCard(g))
          );
        }
        
        row.appendChild(col);
      });
      
      bracket.appendChild(row);
      container.appendChild(bracket);
      return container;
    }
    
    if (winnersStages.length) {
      const title = hasLosers ? "Winners Bracket" : null;
      wrap.appendChild(buildStageRow(title, winnersStages));  
    }
    
    const finalGame = (byRound["Final"] || [])[0];
    if (finalGame?.played) {
      const winnerName =
        Number(finalGame.mapsWonA) > Number(finalGame.mapsWonB) ? finalGame.teamA :
        Number(finalGame.mapsWonB) > Number(finalGame.mapsWonA) ? finalGame.teamB :
        "";
      if (winnerName) {
        const finalCol = wrap.querySelector(".stage-final");
        if (finalCol) {
          const finalGameEl = finalCol.querySelector(".bracket-game");
          if (finalGameEl) {
            const row = document.createElement("div");
            row.className = "bracket-final-row";
            finalGameEl.replaceWith(row);
            row.appendChild(finalGameEl);
            const winnerWrap = document.createElement("div");
            winnerWrap.className = "bracket-winner-wrap";
            const badge = document.createElement("div");
            badge.className = "bracket-winner main";
            badge.textContent = "🏆 Winner: " + winnerName;
            winnerWrap.appendChild(badge);
            row.appendChild(winnerWrap);
          }
        }
      }
    }   
    
    if (hasLosers && losersStages.length) {
      wrap.appendChild(buildStageRow("Losers Bracket", losersStages));
      const finalBGame = (byRound["Final B"] || [])[0];
      if (finalBGame?.played) {
        const winnerName =
          Number(finalBGame.mapsWonA) > Number(finalBGame.mapsWonB) ? finalBGame.teamA :
          Number(finalBGame.mapsWonB) > Number(finalBGame.mapsWonA) ? finalBGame.teamB :
          "";
        if (winnerName) {
          const finalBCol = wrap.querySelector(".stage-final-b");
          if (finalBCol) {
            const finalGameEl = finalBCol.querySelector(".bracket-game");
            if (finalGameEl) {
              const row = document.createElement("div");
              row.className = "bracket-final-row";
              finalGameEl.replaceWith(row);
              row.appendChild(finalGameEl);
              const winnerWrap = document.createElement("div");
              winnerWrap.className = "bracket-winner-wrap";
              const badge = document.createElement("div");
              badge.className = "bracket-winner losers";
              badge.textContent = "🏆 Winner: " + winnerName;
              winnerWrap.appendChild(badge);
              row.appendChild(winnerWrap);
            }
          }
        }
      }
    }
    
    playoffsOut.appendChild(wrap);
  }
  
  if (hidePlayoffs !== 'Yes') {
    fetch(baseUrl + "?endpoint=playoffGames")
      .then(r => r.json())
      .then(renderPlayoffsBracket)
      .catch(e => playoffsOut.textContent = "Error loading playoffs: " + e);
  }    

  // ==================== MAP STATS ====================
  const MAP_BAR_COLORS = [
    "#3b82f6", // blue   - most played
    "#8b5cf6", // purple
    "#06b6d4", // cyan
    "#10b981", // green
    "#f59e0b", // amber
    "#ef4444", // red    - least played
  ];

  function buildMapCard(map, maxPlayed) {
    const card = document.createElement("div");
    card.className = "map-card";

    // ---- header: snapshot + map name overlay ----
    const snapWrap = document.createElement("div");
    snapWrap.className = "map-card-snap";

    const img = document.createElement("img");
    img.src = map.mapSnapUrl || "";
    img.alt = map["Map Name"];
    img.className = "map-card-img";
    img.loading = "lazy";

    const nameOverlay = document.createElement("div");
    nameOverlay.className = "map-card-name";
    nameOverlay.textContent = (map["Map Name"] || "").toUpperCase();

    snapWrap.appendChild(img);
    snapWrap.appendChild(nameOverlay);
    card.appendChild(snapWrap);

    // ---- stats body ----
    const body = document.createElement("div");
    body.className = "map-card-body";

    function statRow(icon, label, value, extra) {
      const row = document.createElement("div");
      row.className = "map-stat-row";
      row.innerHTML = `<span class="map-stat-icon">${icon}</span><span class="map-stat-label">${label}</span><span class="map-stat-value">${value}</span>`;
      if (extra) row.appendChild(extra);
      return row;
    }

    // played + progress bar
    const played = map.Played || 0;
    const pct = maxPlayed > 0 ? (played / maxPlayed) * 100 : 0;
    const colorIndex = maxPlayed > 1
      ? Math.round((1 - (played - 1) / (maxPlayed - 1)) * (MAP_BAR_COLORS.length - 1))
      : 0;
    const barColor = MAP_BAR_COLORS[Math.min(colorIndex, MAP_BAR_COLORS.length - 1)];

    const barWrap = document.createElement("div");
    barWrap.className = "map-bar-wrap";
    barWrap.innerHTML = `<div class="map-bar-fill" style="width:${pct}%;background:${barColor}"></div>`;

    const playedRow = statRow("🎮", "Played", played);
    playedRow.appendChild(barWrap);
    body.appendChild(playedRow);

    // total frags
    body.appendChild(statRow("💥", "Total Frags", Math.ceil(map["Total Frags"] || 0)));

    // avg frags
    body.appendChild(statRow("📊", "Avg Frags", Math.ceil(Number(map["Avg Frags"]) || 0)));

    // dominant team
    if (map["Dominant Team"] && map["Dominant Team"].teamName) {
      const dt = map["Dominant Team"];
      const winPct = Math.round(dt.winPercentage || 0);
      body.appendChild(statRow("👑", "Dominant Team",
        `${dt.teamName} <span class="map-stat-accent">${winPct}% wins</span>`
      ));
      // fix: innerHTML used above so set via innerHTML on value span
      const lastRow = body.lastElementChild;
      const valSpan = lastRow.querySelector(".map-stat-value");
      valSpan.innerHTML = `${dt.teamName} <span class="map-stat-accent">${winPct}% wins</span>`;
    } else {
      body.appendChild(statRow("👑", "Dominant Team", "—"));
    }

    // highest frag game
    if (map["Highest Frag Game"] && map["Highest Frag Game"].gameUrl) {
      const hf = map["Highest Frag Game"];
      const link = document.createElement("a");
      link.href = hf.gameUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "map-game-link";
      link.textContent = `${hf.teamNameA} ${hf.fragsA} vs ${hf.fragsB} ${hf.teamNameB} `;
      const row = statRow("🔥", "Highest Frags", "");
      row.querySelector(".map-stat-value").appendChild(link);
      body.appendChild(row);
    } else {
      body.appendChild(statRow("🔥", "Highest Frags", "—"));
    }

    // most one-sided game
    if (map["Most One-Sided Game"] && map["Most One-Sided Game"].gameUrl) {
      const os = map["Most One-Sided Game"];
      const link = document.createElement("a");
      link.href = os.gameUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "map-game-link";
      link.textContent = `${os.teamNameA} ${os.fragsA} vs ${os.fragsB} ${os.teamNameB}`;
      const row = statRow("⚡", "Most One-Sided", "");
      row.querySelector(".map-stat-value").appendChild(link);
      body.appendChild(row);
    } else {
      body.appendChild(statRow("⚡", "Most One-Sided", "—"));
    }

    card.appendChild(body);
    return card;
  }

  function renderMapStats(data) {
    const out = document.getElementById("mapstats-output");
    out.innerHTML = "";

    if (!data || !data.maps) {
      out.textContent = "No map data.";
      return;
    }

    // Summary header
    const summary = document.createElement("div");
    summary.className = "mapstats-summary";
    summary.innerHTML = `
      <span class="mapstats-summary-item">🗺️ <strong>${data.maps.filter(m => m.Played > 0).length}</strong> maps played</span>
      <span class="mapstats-summary-sep">·</span>
      <span class="mapstats-summary-item">🎮 <strong>${data.totals?.totalPlayed ?? 0}</strong> total games</span>
      <span class="mapstats-summary-sep">·</span>
      <span class="mapstats-summary-item">💥 <strong>${Math.ceil(data.totals?.avgFrags ?? 0)}</strong> avg frags/game</span>
    `;
    out.appendChild(summary);

    // grid of cards
    const grid = document.createElement("div");
    grid.className = "mapstats-grid";

    const maxPlayed = Math.max(...data.maps.map(m => m.Played || 0));

    data.maps.forEach(map => {
      grid.appendChild(buildMapCard(map, maxPlayed));
    });

    out.appendChild(grid);
  }

  fetch(baseUrl + "?endpoint=mapStats")
    .then(r => r.json())
    .then(renderMapStats)
    .catch(e => {
      document.getElementById("mapstats-output").textContent = "Error loading map stats: " + e;
    });

  // ==================== MOBILE SWIPE NAVIGATION ====================
  (function enableSwipeNavigation() {
    if (!window.matchMedia("(max-width: 768px)").matches) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    const SWIPE_THRESHOLD = 60;     // px
    const VERTICAL_LIMIT = 80;      // px

    const navButtons = Array.from(document.querySelectorAll(".app-nav button"));

    function getActiveIndex() {
      return navButtons.findIndex(btn => btn.classList.contains("active"));
    }

    function goToIndex(idx) {
      if (idx < 0 || idx >= navButtons.length) return;
      closeMobileNav();
      navButtons[idx].click();
    }

    document.addEventListener("touchstart", e => {      
      if (e.target.closest('.bracket-popup-wrapper')) return;
      if (e.touches.length !== 1) return;

      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });

    document.addEventListener("touchend", e => {      
      if (e.target.closest('.bracket-popup-wrapper')) return;
      const t = e.changedTouches[0];
      touchEndX = t.clientX;
      touchEndY = t.clientY;

      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;

      // Ignore mostly vertical gestures (scroll)
      if (Math.abs(dy) > Math.abs(dx)) return;
      if (Math.abs(dx) < SWIPE_THRESHOLD) return;
      if (Math.abs(dy) > VERTICAL_LIMIT) return;

      const activeIndex = getActiveIndex();
      if (activeIndex === -1) return;

      closeMobileNav();
      if (dx < 0) {
        // Swipe left → next section
        appNav?.classList.remove("open");
        navToggle && (navToggle.textContent = "☰");
        goToIndex(activeIndex + 1);
      } else {
        // Swipe right → previous section
        appNav?.classList.remove("open");
        navToggle && (navToggle.textContent = "☰");
        goToIndex(activeIndex - 1);
      }
    }, { passive: true });
  })();
});
</script>
<div class="nav-overlay"></div>
</body>
</html>
