<style>
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    margin: 20px;
  }

  /* Rank column emphasis */
  #players-output table th:first-child,
  #players-output table td:first-child {
    font-weight: 1000;
    text-align: center;
    border-right: 2px solid #c3d4f5;
  }

  #players-output table tbody tr:nth-child(1) td:first-child { color: #b8860b; }
  #players-output table tbody tr:nth-child(2) td:first-child { color: #6b7280; }
  #players-output table tbody tr:nth-child(3) td:first-child { color: #a16207; }

  /* Zebra striping */
  table tbody tr:nth-child(even) { background-color: #f1f4f9; }
  table tbody tr:nth-child(odd) { background-color: #ffffff; }
  table tbody tr:hover { background-color: #eef3ff; }

  section { display: none; margin-top: 20px; }
  section.active { display: block; }

  table {
    border-collapse: collapse;
    table-layout: auto;
    margin-top: 10px;
    width: max-content;
    max-width: 100%;
  }

  table th { white-space: normal; line-height: 1.2; }
  th { border: 1px solid #ccc; padding: 6px 10px; background: #eee; }
  td { border: 1px solid #ccc; padding: 6px 10px; white-space: nowrap; }
  .loading { color:#666; }

  .app-nav { margin-bottom: 16px; display:flex; gap:8px; flex-wrap:wrap; }
  .app-nav button {
    background: #f4f6f8;
    color: #333;
    border: 1px solid #c9ced6;
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'Roboto', 'Open Sans', Arial, sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .app-nav button:hover { background: #e9edf2; border-color: #b3bac4; }
  .app-nav button.active {
    background: #e8f4e8;
    border-color: #7db57d;
    color: #1f5f1f;
  }

  .app-logo { max-height:112px; max-width:201px; object-fit:contain; }
  .app-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }
  .app-header-sub { display:flex; align-items:center; gap:14px; }
  .app-header h1 { margin: 0; }

  .wiki-link {
    display: inline-block;
    padding: 6px 12px;
    font-size: 0.9em;
    font-weight: 600;
    color: #0055aa;
    text-decoration: none;
    border: 1px solid #cdddee;
    border-radius: 4px;
    background: #f7faff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .wiki-link:hover { background: #eaf2ff; border-color: #99bbea; }

  h1, h2, h3, .round-header {
    font-family: 'Roboto';
    font-weight: 500;    
  }

  .round-header {
    font-size: 1.1em;
  }

  .round-deadline {
    font-weight: 400;
    font-size: 0.85em;
    color: #6b7280;
    margin-left: 15px;
  }

  /* ======================
   RECENT GAMES
   ====================== */  
  .recent-games {
    display: flex;
    flex-direction: column;
    gap: 8px;    
    max-width: clamp(400px, 85vw, 600px);    
    padding: 0 16px;
    border-top: 1px solid rgba(255,255,255,0.05)
  }

  .recent-game-row {
    display: grid;
    grid-template-columns: 110px 1fr 26px 22px 26px 1fr;
    gap: 10px;
    align-items: center;
    padding: 6px 8px;
    border: 1px solid #d7dbe2;
    border-radius: 8px;
    background: #fff;
    position: relative; /* for popup anchoring */
  }

  .recent-game-date {
    color: #6b7280;
    font-size: 0.95em;
    white-space: nowrap;
  }

  .recent-team {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .recent-score {
    font-family: 'Droid Sans Mono', monospace;
    text-align: center;
    min-width: 26px;
  }

  .recent-show-more {
    display: inline-block;
    margin-top: 10px;
    font-weight: 600;
    color: #0055aa;
    cursor: pointer;
    user-select: none;
    width: fit-content;
  }  

  .recent-game-row .winner {
    font-weight: 700;
  }

  /* Mobile: stack nicely */
  @media (max-width: 768px) {
    .recent-game-row {
      grid-template-columns: 90px 1fr 22px 22px 22px 1fr;
      gap: 8px;
    }
  }

  /* ======================
     GROUP BRACKET (unchanged)
     ====================== */
  .bracket-wrapper {
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin-top: 20px;
  }
  .round-block { display:flex; flex-direction:column; gap:12px; }  
  .round-games {
    display: flex;
    gap: 40px;
    align-items: stretch;
    flex-wrap: nowrap;
  }

  /* Shared game card */
  .bracket-game {
    width: 280px;
    flex-shrink: 0;
  }
  .bracket-match {
    background:#fafafa;
    border:1px solid #ccc;
    padding:8px;
    border-radius:4px;
    position: relative;
  }
  .bracket-player {
    display:flex;
    justify-content:space-between;
    gap: 8px;
    padding:4px 6px;
    word-break: break-word;
  }
  .bracket-player.winner {
    font-weight:bold;
    background:#e8f4e8;
  }

  /* Pulse winner rows (optional flair) */
  @keyframes winnerPulse {
    0%   { box-shadow: 0 0 0 rgba(125,181,125,0.0); }
    50%  { box-shadow: 0 0 10px rgba(125,181,125,0.55); }
    100% { box-shadow: 0 0 0 rgba(125,181,125,0.0); }
  }
  .bracket-player.winner.advanced {
    animation: winnerPulse 1.8s ease-in-out infinite;
    border-radius: 3px;
  }

  .bracket-score {
    font-family: 'Droid Sans Mono', monospace;
    min-width: 24px;
    text-align: right;
  }
  .bracket-match.unplayed {
    background: #fff4f4;
    border-color: #e3b6b6;
  }
  .bracket-match.unplayed .bracket-player { opacity: 0.75; }
  .bracket-match.unplayed .bracket-score { font-weight: normal; }

  .info-icon {
    display:block;
    text-align:center;
    cursor:pointer;
    color:#0055aa;
    margin: 4px 0;
  }
  .info-icon.disabled {
    visibility: hidden;
    pointer-events: none;
  }

  /* Popup */
  .bracket-popup-wrapper {
    display:none;
    position:absolute;
    top: 100%;
    left: 50%;    
    margin-top:6px;
    background:#fffefc;
    border:1px solid #bbb;
    border-radius:4px;
    padding:8px;
    z-index:100;
    min-width:280px;
    max-width:420px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }

  .bracket-game .bracket-popup-wrapper {
    transform: translateX(-50%) translateY(-170%);
  }

  .recent-game-row .bracket-popup-wrapper {
    transform: translateX(-30%) translateY(-128%);
  }

  .bracket-popup-header {
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:6px;
    gap: 8px;
  }
  .bracket-popup-wrapper .bracket-popup-header > div:nth-child(2) {
    text-align: right;
  }
  .bracket-popup-header > div:nth-child(2) {
    margin-left: auto;
    text-align: right;
  }
  .bracket-popup-body-match {
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom:4px;
  }
  .map-name {
    flex-grow:1;
    text-align:center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ======================
     PLAYOFFS
     ====================== */
  .playoffs-wrap {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .playoffs-bracket {
    position: relative;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .playoffs-title {
    font-size: 1.3em;
    font-weight: 700;
    margin: 0 0 8px 0;
  }

  .stage-row {
    position: relative;
    display: flex;
    gap: 36px;
    align-items: flex-start;
    padding: 8px 4px 18px;
    min-width: 980px;
  }  

  .stage-col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: stretch;
  }

  .stage-header {
    text-align: center;
    font-family: 'Roboto';
    font-weight: 500;
    margin-bottom: 4px;
    white-space: nowrap;
    font-size: 1.1em;
  }

  .stage-col .bracket-game { width: 280px; }

  /* === BRACKET VERTICAL ALIGNMENT === */

  /* Semifinals: center between pairs of quarterfinals */
  .stage-semifinals, .stage-final-b {
    margin-top: 65px; /* ~½ game height + gap */
  }

  /* Push the SECOND semifinal down so it aligns with QF 3 & 4 */
  .stage-semifinals .bracket-game:nth-child(3) {
    margin-top: 115px; /* ≈ height of one QF card */
  }

  /* Final: centered between the two semifinals */
  .stage-final {
    margin-top: 182px;
  }

  /* Bronze: sits below Final naturally */
  .stage-bronze {
    margin-top: 294px;
  }

  .stage-bronze-header {
    /*margin-top: 24px;*/
    text-align: center;
    font-family: 'Roboto';
    font-weight: 500;
    white-space: nowrap;
  }

  /* Subtle separator between Final and Bronze */
  .stage-final-separator, .stage-final-b-separator {
    width: 280px;               /* match game width */
    height: 1px;
    background: linear-gradient(
      to right,
      transparent,
      #d0d4da,
      transparent
    );
    margin: 16px 0;
  }
  
  /* Center Final & Final B headers over the GAME, not the winner badge */
  .stage-final > .stage-header,
  .stage-final-b > .stage-header {
    width: 280px;          /* same as .bracket-game */
    margin-left: 0;
    margin-right: 0;
    text-align: center;
  }

  .bracket-winner {
    font-family: 'Roboto', 'Open Sans', Arial, sans-serif;
    font-weight: 700;
    font-size: 1.1em;
    padding: 10px 12px;
    border-radius: 8px;
    width: fit-content;
    white-space: nowrap;    
  }

  /* Row that holds Final game + winner badge */
  .bracket-final-row {
    display: flex;
    align-items: center;
  }

  /* Space between game card and winner badge */
  .bracket-winner-wrap {
    margin-left: 20px;
    display: flex;
    align-items: center;
  }

  /* Winners bracket winner */
  .bracket-winner.main {
    background: #fff7d6;
    border: 1px solid #e6d28a;
  }

  /* Losers bracket winner */
  .bracket-winner.losers {
    background: #e9f1ff;
    border: 1px solid #9bb7e6;
  }

  /* Rank tooltip */
  .rank-header {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .rank-tooltip-icon {
    cursor: pointer;
    font-size: 0.9em;
    color: #0055aa;
    user-select: none;
  }

  .rank-tooltip {
    display: none;
    position: absolute;
    top: 130%;
    left: 50%;
    transform: translateX(5%) translateY(-130%);
    background: #fffefc;
    border: 1px solid #bbb;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.9em;
    line-height: 1.35;
    min-width: 220px;
    max-width: 320px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    z-index: 200;    
  }

  .rank-tooltip.open {
    display: block;
  }

  /* ======================
     MOBILE
     ====================== */
  @media (max-width: 768px) {
    body { margin: 10px; font-size: 18px; }

    table { display:block; overflow-x:auto; }

    .round-games { flex-direction: column; gap: 16px; }
    .bracket-game { width: 100% !important; }

    .bracket-game .bracket-popup-wrapper, .recent-game-row .bracket-popup-wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 1000;
    }

    .stage-col {
      width: 100%;
      min-width: 0;
    }

    .stage-row {
      min-width: 0;
      flex-direction: column;
      gap: 20px;
    }

    .stage-col .bracket-game { width: 100% !important; }

    #players-output table:not(.show-all-cols) th:nth-child(n+9),
    #players-output table:not(.show-all-cols) td:nth-child(n+9) {
      display: none;
    }

    #players-output table.show-all-cols th,
    #players-output table.show-all-cols td {
      display: table-cell;
    }

    .players-toggle {
      display: block;
      margin: 8px 0 4px;
      font-size: 0.95em;
      font-weight: 600;
      color: #0055aa;
      background: none;
      border: none;
      padding: 6px 0;
      cursor: pointer;
    }

    /* Center decisive stage titles on mobile */
    .stage-quarterfinals > .stage-header,
    .stage-semifinals > .stage-header,
    .stage-semifinals-b > .stage-header,
    .stage-final > .stage-header,
    .stage-bronze > .stage-header,
    .stage-final-b > .stage-header {
      width: auto !important;
      text-align: center;
    }

    .stage-final-separator, .stage-final-b-separator {
      width: auto !important ;
    }

    .round-header {
      text-align: center;      
    }

    /* ===== REMOVE DESKTOP ALIGNMENT GAPS ===== */
    .stage-semifinals,
    .stage-final,
    .stage-bronze,
    .stage-final-b {
      margin-top: 0 !important;
    }

    .stage-semifinals .bracket-game:nth-child(3) {
      margin-top: 0 !important;
    }

    /* ===== CENTER HEADERS NICELY ===== */
    .stage-header {
      text-align: left;
      padding-left: 4px;
    }

    /* ===== FINAL + WINNER BADGE STACK ===== */
    .bracket-final-row {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .bracket-winner-wrap {
      margin-left: 0;
    }
    .rank-tooltip {
      position: fixed;
      top: 35%;
      left: 45%;
      transform: translateX(-50%);
      max-width: 90vw;
      z-index: 2000;
    }
  }
</style>
